<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanish Study Tool</title>
<style>
  :root{
    --bg:#f6f4fb; --card:#ffffff; --ink:#3a3550; --muted:#8b86a3;
    --line:#eae6f4; --accent:#e879a6; --accent-d:#d65d8e; --accent2:#7bc9c1;
    --purple:#a98fe0; --good:#4caf82; --good-bg:#e7f7ef; --bad:#e5688a; --bad-bg:#fdeaf1;
    --sidebar:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#f7f2fb,#eef6f6);
    color:var(--ink); min-height:100vh;
  }
  .wrap{display:flex; min-height:calc(100vh - 60px)}
  .wrap[hidden],.soon[hidden]{display:none}

  /* ---------- Level picker (Spanish 1 / 2 / 3) ---------- */
  .levelbar{display:flex; align-items:center; gap:10px; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .levelbar .lb-title{font-weight:800; font-size:13px; color:var(--muted); margin-right:4px}
  .levels{display:flex; gap:4px; background:#f0ebf8; padding:4px; border-radius:12px}
  .level{border:none; background:transparent; padding:8px 16px; border-radius:9px; font-weight:800; font-size:13.5px; color:var(--muted); cursor:pointer; transition:.15s}
  .level:hover{color:var(--ink)}
  .level.active{background:#fff; color:var(--accent-d); box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .level small{font-weight:700; font-size:10.5px; opacity:.75; margin-left:4px}
  @media (max-width:520px){
    .levelbar{padding:8px 10px} .levelbar .lb-title{display:none}
    .levels{flex:1; min-width:0} .level{flex:1; padding:8px 4px; font-size:12.5px}
    .level small{display:block; margin:0}
  }
  .credit{margin-top:auto; padding:18px 16px 22px; text-align:center; font-size:12.5px; font-weight:700; color:var(--muted)}
  .credit a{color:var(--accent-d); text-decoration:none} .credit a:hover{text-decoration:underline}
  .soon{display:grid; place-items:center; min-height:calc(100vh - 60px); padding:24px 16px}
  .soon .card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:36px 28px; text-align:center; max-width:440px; box-shadow:0 6px 24px rgba(120,100,170,.08)}
  .soon .big{font-size:44px}
  .soon h2{margin:10px 0 6px; font-size:24px}
  .soon p{color:var(--muted); margin:0 0 18px; line-height:1.5}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:260px; flex:0 0 260px; background:var(--sidebar);
    border-right:1px solid var(--line); padding:18px 14px; display:flex; flex-direction:column; gap:6px;
  }
  .brand{display:flex; align-items:center; gap:9px; padding:4px 6px 14px}
  .brand .flag{font-size:26px}
  .brand h1{font-size:17px; margin:0; font-weight:800; letter-spacing:.2px}
  .brand small{display:block; color:var(--muted); font-weight:600; font-size:11px}
  .side-label{font-size:11px; font-weight:800; letter-spacing:.8px; color:var(--muted); text-transform:uppercase; margin:14px 6px 6px}
  .navbtn{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    border:none; background:transparent; color:var(--ink); font-size:14px; font-weight:600;
    padding:9px 11px; border-radius:11px; cursor:pointer; transition:.15s;
  }
  .navbtn:hover{background:#f3eefb}
  .navbtn.active{background:linear-gradient(120deg,#fce4ee,#eee6fb); color:var(--accent-d); box-shadow:inset 0 0 0 1px #f2d8e6}
  .navbtn .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--purple)}
  .navbtn .cnt{margin-left:auto; font-size:11px; color:var(--muted); font-weight:700}
  .sec-btn{font-size:13px; padding:8px 11px}
  .sec-btn.active{background:#eafaf7; color:#2f8f84; box-shadow:inset 0 0 0 1px #cdeee9}
  .sec-btn.active .dot{background:var(--accent2)}
  .side-foot{margin-top:auto; font-size:11px; color:var(--muted); padding:12px 6px 2px; line-height:1.5}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .topbar{
    background:rgba(255,255,255,.75); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:14px 22px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:5;
  }
  .topbar h2{margin:0; font-size:19px; font-weight:800}
  .topbar .sub{color:var(--muted); font-size:12px; font-weight:600; margin-top:1px}
  .spacer{flex:1}
  .tabs{display:flex; gap:4px; background:#f0ebf8; padding:4px; border-radius:12px}
  .tab{border:none; background:transparent; padding:8px 15px; border-radius:9px; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer; transition:.15s}
  .tab.active{background:#fff; color:var(--accent-d); box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .dirtoggle{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--ink)}
  .pill{
    border:none; cursor:pointer; padding:8px 13px; border-radius:20px; font-weight:800; font-size:12.5px;
    background:linear-gradient(120deg,var(--accent),var(--purple)); color:#fff; box-shadow:0 2px 8px rgba(169,143,224,.35);
    display:inline-flex; align-items:center; gap:7px; transition:.15s;
  }
  .pill:hover{filter:brightness(1.03)}
  .pill.ghost{background:#fff; color:var(--accent-d); box-shadow:inset 0 0 0 1.5px #f0d5e2}

  .content{padding:22px; max-width:900px; width:100%; margin:0 auto}

  /* ---------- Review ---------- */
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .toolbar .count{margin-left:auto; font-size:13px; color:var(--muted); font-weight:700}
  .btn{border:none; cursor:pointer; padding:8px 13px; border-radius:10px; font-weight:700; font-size:13px; background:#efeaf8; color:var(--ink); transition:.15s}
  .btn:hover{background:#e6def5}
  .btn.subtle{background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1.5px #e6def5}
  .btn.subtle:hover{background:#f5f1fb; color:var(--ink)}
  .sectionhdr{font-size:12px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--accent-d); margin:18px 2px 8px}
  .wordgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  @media (max-width:640px){ .wordgrid{grid-template-columns:1fr} }
  .wcard{
    display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; cursor:pointer; transition:.12s; user-select:none;
  }
  .wcard:hover{border-color:#e3d5f2}
  .wcard.off{opacity:.45}
  .wcard .box{width:19px;height:19px;border-radius:6px;border:2px solid #d8cdec;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .wcard.on .box{background:var(--accent);border-color:var(--accent)}
  .wcard .es{font-weight:700}
  .wcard .en{color:var(--muted); font-size:13px}
  .wcard .txt{min-width:0}
  .wcard .txt div{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  /* ---------- Vocab hub (boxes) ---------- */
  .navbtn.sub{margin-left:6px}
  .weekbar{display:flex; gap:8px; margin:0 2px 14px; flex-wrap:wrap}
  .wchip{border:1.5px solid var(--line); background:#fff; cursor:pointer; padding:7px 15px; border-radius:20px; font-weight:800; font-size:13px; color:var(--muted)}
  .wchip.on{border-color:var(--accent); background:linear-gradient(120deg,#fce4ee,#eee6fb); color:var(--accent-d)}
  .practicebtn{display:block; width:100%; padding:15px; border-radius:14px; font-size:16px; color:#fff; background:linear-gradient(120deg,var(--accent),var(--purple)); box-shadow:0 8px 20px rgba(169,143,224,.35); margin:0 0 16px}
  .practicebtn:disabled{opacity:.5}
  .ptitle{font-size:22px; font-weight:800; margin:8px 2px 2px}
  .psub{color:var(--muted); font-size:13px; font-weight:600; margin:0 2px 14px}
  .wcard.read{cursor:default}
  .dirlist{display:flex; flex-direction:column; gap:12px; margin-top:8px}
  .dircard{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:16px 18px; cursor:pointer; box-shadow:0 4px 16px rgba(90,70,150,.05); transition:.15s}
  .dircard:hover{border-color:#e3d5f2; transform:translateY(-2px)}
  .dircard.on{border-color:var(--accent-d); background:#faf7ff}
  .dircard .di{font-size:26px}
  .dircard .dtx{flex:1}
  .dircard .dt{font-weight:800; font-size:16px}
  .dircard .dd{font-size:12.5px; color:var(--muted); font-weight:600}
  .dircard .go{color:var(--muted); font-weight:800}
  .accents{display:flex; flex-wrap:wrap; gap:6px; max-width:460px; margin:12px auto 0; justify-content:center}
  .conjgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px}
  .conjcell{border:1.5px solid #eee; border-radius:10px; padding:7px 9px; text-align:left; background:#fff}
  .conjcell .who{font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700}
  .conjcell .form{font-size:15px; font-weight:700; color:var(--ink)}
  /* The four cells that change stem — the shape they make is the boot. */
  .conjcell.inboot{border-color:var(--accent-d); background:#faf7ff}
  .bootnote{font-size:11px; color:var(--muted); text-align:center; margin-top:6px}
  .accbtn{border:1.5px solid #e5e2f0; background:#fff; border-radius:10px; min-width:38px; padding:8px 0; font-size:16px; font-weight:700; cursor:pointer; color:var(--ink)}
  .accbtn:hover{background:#f3eefb; border-color:var(--purple)}
  .unit-row{display:flex; align-items:stretch; gap:2px}
  .unit-row .unit-tab{flex:1}
  .ut-caret{border:none; background:transparent; cursor:pointer; color:var(--muted); font-size:13px; padding:0 9px; border-radius:10px; flex:0 0 auto}
  .ut-caret:hover{background:#f3eefb; color:var(--accent-d)}
  .navbtn.unit-tab{padding:11px 12px}
  .ut-label{display:flex; flex-direction:column; line-height:1.2; text-align:left}
  .ut-label small{font-size:11px; font-weight:600; color:var(--muted); margin-top:1px}
  .navbtn.unit-tab.active .ut-label small{color:var(--accent-d)}
  .backbtn{border:none;background:#f0ebf8;color:var(--accent-d);font-weight:800;cursor:pointer;padding:8px 13px;border-radius:10px;font-size:13px}
  .backbtn:hover{background:#e6def5}
  .hub{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px}
  .hubcard{
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 20px 22px;
    cursor:pointer; transition:.15s; position:relative; overflow:hidden; box-shadow:0 4px 18px rgba(120,90,160,.06);
  }
  .hubcard:hover{transform:translateY(-3px); border-color:#e3d5f2; box-shadow:0 12px 26px rgba(120,90,160,.14)}
  .hubcard.allcard{background:linear-gradient(140deg,#fce7f0,#eee6fb); border-color:#f0d8e6}
  .hub.unit-home{grid-template-columns:1fr 1fr; gap:18px; max-width:620px}
  @media (max-width:560px){ .hub.unit-home{grid-template-columns:1fr} }
  .hubcard.bigcard{padding:30px 22px; min-height:170px; display:flex; flex-direction:column; justify-content:center}
  .hubcard.bigcard h3{font-size:21px}
  .ic.big{font-size:44px; margin-bottom:14px}
  .hubcard .ic{font-size:30px; display:block; margin-bottom:12px}
  .hubcard h3{margin:0 0 4px; font-size:17px; font-weight:800}
  .hubcard .meta{color:var(--muted); font-size:13px; font-weight:600}
  .hubcard .bar{height:6px; background:#efeaf8; border-radius:5px; margin-top:14px; overflow:hidden}
  .hubcard .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--purple))}
  .hubcard .go{position:absolute; top:16px; right:18px; color:var(--muted); font-size:18px; font-weight:800}

  /* ---------- Practice ---------- */
  .stage{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:30px 26px; box-shadow:0 8px 30px rgba(120,90,160,.07)}
  .prog{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .progbar{flex:1; height:8px; background:#efeaf8; border-radius:6px; overflow:hidden}
  .progbar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--purple)); width:0; transition:.3s}
  .progtxt{font-size:12px; font-weight:800; color:var(--muted)}
  .qmeta{text-align:center; font-size:12px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--accent2); margin:22px 0 4px}
  .prompt{text-align:center; font-size:40px; font-weight:800; margin:6px 0 4px; line-height:1.15}
  .askside{text-align:center; color:var(--muted); font-size:13px; font-weight:700; margin-bottom:20px}
  .answer{display:flex; gap:10px; max-width:460px; margin:0 auto}
  .answer input{
    flex:1; padding:14px 16px; font-size:17px; border:2px solid #e7ddf3; border-radius:13px; outline:none; transition:.15s;
    font-family:inherit; color:var(--ink);
  }
  .answer input:focus{border-color:var(--purple)}
  .feedback{max-width:460px; margin:16px auto 0; border-radius:14px; padding:14px 16px; text-align:center; font-weight:700}
  .feedback.good{background:var(--good-bg); color:var(--good)}
  .feedback.bad{background:var(--bad-bg); color:var(--bad)}
  .feedback .corr{display:block; font-size:15px; margin-top:4px; color:var(--ink)}
  .feedback.bad .corr{color:var(--bad)} .feedback.bad .corr b{color:var(--bad); font-weight:800}
  .fbrow{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap}
  .summary{text-align:center; padding:14px}
  .summary .big{font-size:52px; font-weight:800; margin:6px 0}
  .summary .lbl{color:var(--muted); font-weight:700}
  .missed{margin:18px auto 0; max-width:520px; text-align:left}
  .missed .m{display:flex; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--line); font-size:14px}
  .missed .m span:last-child{color:var(--muted)}

  /* ---------- Flashcards ---------- */
  .flash{perspective:1200px; max-width:520px; margin:0 auto}
  .fcard{position:relative; height:260px; cursor:pointer; transform-style:preserve-3d; transition:transform .5s; }
  .fcard.flip{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:22px; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:24px; text-align:center; box-shadow:0 10px 34px rgba(120,90,160,.12)}
  .front{background:linear-gradient(150deg,#fff,#faf5ff); border:1px solid var(--line)}
  .back{background:linear-gradient(150deg,#eafaf7,#f2f0ff); border:1px solid #d8efe9; transform:rotateY(180deg)}
  .face .big{font-size:38px; font-weight:800; line-height:1.15}
  .face .tag{font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .face .hint{position:absolute; bottom:14px; font-size:12px; color:var(--muted)}
  .flashbar{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:18px}
  .rounder{width:44px;height:44px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:18px;cursor:pointer;color:var(--ink)}
  .rounder:hover{background:#faf5ff}

  .empty{text-align:center; color:var(--muted); padding:50px 20px}
  .empty .em{font-size:40px; margin-bottom:10px}

  .mobtop{display:none}
  @media (max-width:820px){
    .wrap{flex-direction:column}
    .sidebar{width:auto; flex:none; flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); gap:6px; padding:10px}
    .brand,.side-label,.side-foot{display:none}
    .navbtn{white-space:nowrap; width:auto}
    .navbtn .cnt{display:none}
    .prompt{font-size:32px}
  }
  /* ---------- Map (Unit 4) ---------- */
  .mapcard{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; box-shadow:0 6px 24px rgba(120,100,170,.06); display:flex; gap:16px; align-items:flex-start}
  .mapcard .mapwrap{flex:1 1 62%; min-width:0}
  .mapkey{flex:1 1 34%; min-width:0}
  .mapwrap{display:flex; gap:10px; align-items:flex-start; max-width:760px; margin:0 auto}
  .mappanel{position:relative}
  .mappanel.main{flex:1 1 auto; min-width:0}
  .insets{display:flex; flex-direction:column; gap:10px; flex:0 0 150px}
  .mappanel.spain, .mappanel.guinea{border:1px solid var(--line); border-radius:12px; padding:4px; background:#fff}
  .mapcap{text-align:center; font-size:11px; font-weight:800; color:var(--muted); padding:2px 0 3px}
  .mapcap small{font-weight:600}
  .mapsvg{display:block; width:100%; height:auto; background:#f6f4fb; border-radius:10px}
  .mapsvg .ctx{fill:#e6e2ef; stroke:#fff; stroke-width:.8}
  .mapsvg .cty{fill:#fff; stroke:#9a94b3; stroke-width:1; transition:fill .15s}
  .mapsvg .cty.hl{fill:var(--accent)}
  .mapsvg .cty.ok{fill:var(--good)}
  .mapsvg .cty.no{fill:var(--bad)}
  .mapsvg .click{cursor:pointer}
  .mapsvg .cty.click:hover{fill:#fce4ee}
  .mapsvg .hit{fill:transparent; pointer-events:none}
  .mapsvg .hit.click{pointer-events:all}
  .mapsvg .pulse{fill:none; stroke:var(--accent-d); stroke-width:2; animation:mappulse 1.2s ease-out infinite}
  @keyframes mappulse{0%{r:10; opacity:1} 100%{r:22; opacity:0}}
  .mapsvg .leader{stroke:#9a94b3; stroke-width:.8}
  .mapsvg .mlabel circle{fill:var(--accent2); stroke:#fff; stroke-width:1.2}
  .mapsvg .mlabel.on circle{fill:var(--accent-d)}
  .mapsvg .mlabel text{fill:#fff; font-size:12px; font-weight:800; text-anchor:middle; pointer-events:none; font-family:inherit}
  .mappick{background:linear-gradient(120deg,#fce4ee,#eee6fb); border-radius:14px; padding:12px 14px; font-size:15px; line-height:1.5; margin-bottom:10px}
  .mappick span{color:var(--muted); font-weight:600}
  .mappick small{display:block; color:var(--muted); font-size:12px}
  .mappick.muted{background:#f6f4fb; color:var(--muted); font-weight:600; font-size:13px}
  .maplist{display:flex; flex-direction:column; max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:14px}
  .maprow{display:flex; align-items:center; gap:10px; border:none; background:#fff; text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; font:inherit; color:var(--ink)}
  .maprow .cap small{display:block; font-size:11px; color:var(--muted); font-weight:600}
  .maprow:last-child{border-bottom:none}
  .maprow:hover{background:#faf7fd}
  .maprow.on{background:linear-gradient(120deg,#fce4ee,#eee6fb)}
  .maprow .ltr{width:22px; height:22px; border-radius:50%; background:var(--accent2); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:0 0 auto}
  .maprow.on .ltr{background:var(--accent-d)}
  .maprow .nm{flex:1; min-width:0; font-size:14px} .maprow .nm small{display:block; color:var(--muted); font-size:11.5px; font-weight:600}
  .maprow .cap{font-size:13px; color:var(--muted); font-weight:700; text-align:right; padding-left:8px; flex:0 0 auto; max-width:48%}
  .mapstage .mapwrap{margin:6px auto 14px; max-width:600px}
  .prompt.small{font-size:26px}
  @media (max-width:820px){ .mapcard{flex-direction:column} .mapcard .mapwrap,.mapkey{flex-basis:auto; width:100%} .maplist{max-height:320px} .insets{flex-basis:120px} }
</style>
</head>
<body>
<div class="levelbar" id="levelbar"></div>
<div class="soon" id="soon" hidden></div>
<div id="soonCredit" hidden><div class="credit">Made by <a href="https://meckman2025.github.io/portfolio/" target="_blank" rel="noopener">Kayden</a></div></div>
<div class="wrap" id="wrap">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
    <div class="credit">Made by <a href="https://meckman2025.github.io/portfolio/" target="_blank" rel="noopener">Kayden</a></div>
  </main>
</div>

<script>
/* ============================ DATA ============================ */
let DATA = {
  units: [
    {
      id:"u1",
      name:"Unit 1 — Robo en la Noche",
      sets:[
        { name:"Los Sustantivos", words:[
          {es:"las alas", en:"wings", week:3},
          {es:"las aves", en:"birds", week:[3,4]},
          {es:"el bruto", en:"jerk/rude person", week:3},
          {es:"el caballo", en:"horse", week:3},
          {es:"las cabañas", en:"cabins", week:3},
          {es:"la ciudad", en:"city", week:[3,4]},
          {es:"el cuchillo", en:"knife", week:3},

// Nouns come from the vocab list, so the grammar drills use words already being
// learned. The article carries both gender and number, which is exactly what
// gusta/gustan and nuestro/a/os/as need.
function articleNouns(){
  const out=[];
  DATA.units.forEach(u=>u.sets.forEach(s=>s.words.forEach(w=>{
    const m=/^(el|la|los|las) (.+)$/.exec(w.es);
    if(m) out.push({ art:m[1], noun:m[2], en:w.en, plural:m[1]==='los'||m[1]==='las', fem:m[1]==='la'||m[1]==='las' });
  })));
  return out;
}

// "Unit 1–2", from the part of the name before the dash
const unitLabel = (u=unit()) => u.name.split('—')[0].trim();
// culture topics for this unit: a topic with `unit:` shows only there; one without shows in every unit
const cultureHere = () => CULTURE.filter(t => !t.unit || t.unit === unit().id);
const key = w => unit().id+"::"+w.es;
const weekNum = label => { const m=/^Semana\s+(\d+)$/.exec(label||""); return m ? +m[1] : null; };
// A word's weeks, always as a list, so `week:4` and `week:[3,4]` both read the same.
const weeksOf = w => w.week == null ? [] : Array.isArray(w.week) ? w.week : [w.week];
// Every group that actually has words: the numbered weeks in order, then any
// named ones. A group can be a name rather than a number — `week:"Food Vocab"`
// — because not every list in the packet is a week. The food page is a list of
// things to know, handed out alongside Semana 8 rather than instead of it, and
// numbering it would have said it replaced the week.
function weeksInUnit(){
  const seen=new Set();
  unit().sets.forEach(s=>s.words.forEach(w=>weeksOf(w).forEach(n=>seen.add(n))));
  const all=[...seen];
  const nums=all.filter(x=>typeof x==='number').sort((a,b)=>a-b);
  const names=all.filter(x=>typeof x==='string');
  return [...nums, ...names];
}

  // number — or a named list, where the label itself is what the words carry.
  const num = weekNum(state.week);
  const wk = state.week === 'All' ? null : (num != null ? num : state.week);
  const out=[];
  unit().sets.forEach(set=>{
    set.words.forEach(w=>{
      if(wk != null && !weeksOf(w).includes(wk)) return;
      out.push({...w, section:set.name});
    });
  });
  return out;
}
function isSel(w){ if(state.selected===null) return true; return !!state.selected[key(w)]; }
function ensureSelectedObj(){ if(state.selected===null){ state.selected={}; DATA.units.forEach(u=>u.sets.forEach(s=>s.words.forEach(w=>state.selected[u.id+"::"+w.es]=true))); } }
function selectedWords(){ return allWords().filter(isSel); }

function norm(s){
  return (s||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")   // strip accents (ñ->n, á->a)
    .replace(/\(.*?\)/g," ")                            // drop (parentheticals)
    .replace(/[¿?¡!.,;:"']/g," ")
    .replace(/\b(to|el|la|los|las|un|una)\b/g," ")      // drop articles / "to"
    .replace(/[^a-z0-9 ]/g," ")
    .replace(/\s+/g," ").trim();
}
function acceptable(expected){
  const set=new Set();
  expected.replace(/\(.*?\)/g," ").split(/[\/,;]| or /i).forEach(p=>{const n=norm(p); if(n) set.add(n);});
  const whole=norm(expected); if(whole) set.add(whole);
  return set;
}
function isCorrect(userText, expected){
  const u=norm(userText); if(!u) return false;
  return acceptable(expected).has(u);
}

// Spanish answers KEEP the article (el/la/los…) — accents are still forgiven.
function normEs(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[¿?¡!.,;:"']/g," ").replace(/\s+/g," ").trim();
}
function acceptableEs(expected){
  const set=new Set();
  const noParen=expected.replace(/\(.*?\)/g," ");
  [expected, noParen].forEach(v=>{ const n=normEs(v); if(n) set.add(n); });
  expected.split("/").forEach(p=>{ const n=normEs(p); if(n) set.add(n); });
  return set;
}
// dir 'en2es' means the answer is Spanish (article required); 'es2en' means English (lenient).
function checkAns(user, answer, answerIsEs){
  if(!user || !user.trim()) return false;
  return answerIsEs ? acceptableEs(answer).has(normEs(user)) : isCorrect(user, answer);
}

function regularConj(inf){
  const stem=inf.slice(0,-2), end=inf.slice(-2);
  const E={ar:["o","as","a","amos","áis","an"], er:["o","es","e","emos","éis","en"], ir:["o","es","e","imos","ís","en"]}[end];
  return { yo:stem+E[0], tu:stem+E[1], el:stem+E[2], nos:stem+E[3], vos:stem+E[4], ellos:stem+E[5] };
}
function bootStem(stem, change){ const [f,t]=change.split("-"); const i=stem.lastIndexOf(f); return i<0?stem:stem.slice(0,i)+t+stem.slice(i+1); }
function bootConj(inf, change){
  const reg=regularConj(inf), bstem=bootStem(inf.slice(0,-2), change), end=inf.slice(-2);
  const E={ar:["o","as","a","an"], er:["o","es","e","en"], ir:["o","es","e","en"]}[end];
  return { yo:bstem+E[0], tu:bstem+E[1], el:bstem+E[2], nos:reg.nos, vos:reg.vos, ellos:bstem+E[3] };
}
const _RP={yo:"me",tu:"te",el:"se",nos:"nos",vos:"os",ellos:"se"};
function conjugate(v){
  const reflexive=v.inf.endsWith("se"), base=reflexive?v.inf.slice(0,-2):v.inf;
  let f = v.forms ? {...v.forms} : v.type==="boot" ? bootConj(base, v.change) : regularConj(base);
  if(reflexive){ const o={}; for(const k in f) o[k]=_RP[k]+" "+f[k]; return o; }
  return f;
}

// Adjectives of nationality (the Nacionalidades sheet). -o/-a change for gender; -ense never does; español adds -a.
const NATIONALITIES = { ESP:'español', MEX:'mexicano', GTM:'guatemalteco', HND:'hondureño', SLV:'salvadoreño', NIC:'nicaragüense',
  CRI:'costarricense', PAN:'panameño', CUB:'cubano', DOM:'dominicano', PRI:'puertorriqueño', VEN:'venezolano', COL:'colombiano',
  ECU:'ecuatoriano', PER:'peruano', BOL:'boliviano', CHL:'chileno', PRY:'paraguayo', ARG:'argentino', URY:'uruguayo', GNQ:'ecuatoguineano' };
// adjective shown like the sheet: argentino/a, but costarricense stays the same for both
const natDisplay = adj => /e$/.test(adj) ? adj : adj+'/a';
// the nationality for a subject: gender m/f, plural true/false
function nationality(adj, g, pl){
  let w = adj;
  if(/o$/.test(adj)) w = adj.slice(0,-1) + (g==='f' ? 'a' : 'o');
  else if(!/e$/.test(adj) && g==='f') w = adj + 'a';          // español → española
  if(pl) w += /[aeiou]$/.test(w) ? 's' : 'es';                 // vowel + s, consonant + es
  return w;
}

// Spelling counts: the whole name has to be there (accents are forgiven, like everywhere else).
// Country answers may be Spanish or English; capitals take the Spanish name or the usual English one.
function mapAnswers(c, kind){
  return kind==='country' ? [c.es, c.en] : [c.cap, ...(c.alt||[])];
}
function mapCheck(user, c, kind){
  const u=normEs(user); if(!u) return false;
  return mapAnswers(c, kind).some(a=>normEs(a)===u);
}
const mapAnswerText = (c, kind) => kind==='country' ? `${c.es} (${c.en})` : c.cap;

// o: {hl, ok, no, click, letters, names:'full'|'region'}
function mapSvg(o={}){
  const panel = p => {
    let h=`<svg class="mapsvg" viewBox="0 0 ${p.w} ${p.h}" preserveAspectRatio="xMidYMid meet">`;
    p.context.forEach(d=>{ h+=`<path class="ctx" d="${d}"/>`; });
    let after='';
    Object.entries(p.countries).forEach(([iso,c])=>{
      const cls='cty'+(o.click?' click':'')+(iso===o.hl?' hl':'')+(iso===o.ok?' ok':'')+(iso===o.no?' no':'');
      h+=`<path class="${cls}" data-iso="${iso}" d="${c.d}"/>`;
      if(c.small) after+=`<circle class="hit${o.click?' click':''}" data-iso="${iso}" cx="${c.cx}" cy="${c.cy}" r="15"/>`;
      if(iso===o.hl && c.small) after+=`<circle class="pulse" cx="${c.cx}" cy="${c.cy}" r="14"/>`;
      if(o.letters){
        const [dx,dy]=MAP_LABEL_OFFSET[iso]||[0,0], x=c.cx+dx, y=c.cy+dy, cc=mapCountry(iso);
        const on = iso===o.hl;
        if(dx||dy) after+=`<line class="leader" x1="${c.cx}" y1="${c.cy}" x2="${x}" y2="${y}"/>`;
        after+=`<g class="mlabel${on?' on':''}${o.click?' click':''}" data-iso="${iso}"><circle cx="${x}" cy="${y}" r="10.5"/><text x="${x}" y="${y+4.2}">${cc.letter}</text></g>`;
      }
    });
    h+=after+`</svg>`;
    const title = o.names==='full'
      ? (p.id==='main' ? '' : `${esc(mapCountry(p.id==='spain'?'ESP':'GNQ').es)} <small>(${MAP_PANEL_NAME[p.id]})</small>`)
      : (p.id==='main' ? '' : MAP_PANEL_NAME[p.id]);
    return `<div class="mappanel ${p.id}">${h}${title?`<div class="mapcap">${title}</div>`:''}</div>`;
  };
  const [main, ...insets] = MAP_DATA.panels;
  return `<div class="mapwrap">${panel(main)}<div class="insets">${insets.map(panel).join('')}</div></div>`;
}
function wireMapClicks(root, fn){
  root.querySelectorAll("[data-iso]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); fn(el.dataset.iso); });
}

/* -------- Map home: the lettered map, the key, and the practice modes -------- */
function renderMapHome(c){
  const pick = state.mpick ? mapCountry(state.mpick) : null;
  let h=`<div class="sectionhdr">Study the map</div>
    <div class="mapcard">${mapSvg({letters:true, click:true, hl:state.mpick, names:'full'})}
      <div class="mapkey">
        ${pick ? `<div class="mappick">${flagOf(pick.cc)} <b>${esc(pick.es)}</b> <span>${esc(pick.en)}</span><br>capital: <b>${esc(pick.cap)}</b> · nacionalidad: <b>${esc(natDisplay(pick.adj))}</b>${pick.note?`<small>${esc(pick.note)}</small>`:''}</div>`
               : `<div class="mappick muted">Tap a country or a letter to see its name and capital.</div>`}
        <div class="maplist">${MAP_COUNTRIES.map(k=>`
          <button class="maprow ${k.iso===state.mpick?'on':''}" data-row="${k.iso}">
            <span class="ltr">${k.letter}</span><span class="flg">${flagOf(k.cc)}</span>
            <span class="nm"><b>${esc(k.es)}</b><small>${esc(k.en)}</small></span>
            <span class="cap">${esc(k.cap)}<small>${esc(natDisplay(k.adj))}</small></span>
          </button>`).join('')}</div>
      </div>
    </div>
    <div class="sectionhdr">Practice</div>
    <div class="hub">${MAP_MODES.map(m=>`
      <div class="hubcard bigcard ${m.mix?'allcard':''}" data-mode="${m.id}">
        <span class="go">→</span><span class="ic big">${m.ic}</span>
        <h3>${esc(m.name)}</h3><div class="meta">${esc(m.desc)}</div>
      </div>`).join('')}</div>`;
  c.innerHTML=h;
  const choose = iso => { state.mpick = state.mpick===iso ? null : iso; render(); };
  wireMapClicks(c, choose);
  c.querySelectorAll("[data-row]").forEach(b=>b.onclick=()=>choose(b.dataset.row));
  c.querySelectorAll("[data-mode]").forEach(el=>el.onclick=()=>{ startMapQuiz(el.dataset.mode); render(); window.scrollTo(0,0); });
}

function mapQueue(modeId){
  const m=mapMode(modeId);
  if(m.mix){
    const ways=MAP_MODES.filter(x=>!x.mix);
    return shuffle(MAP_COUNTRIES.map(c=>{ const w=ways[Math.floor(Math.random()*ways.length)]; return {c, ask:w.ask, ans:w.ans}; }));
  }
  return shuffle(MAP_COUNTRIES.map(c=>({c, ask:m.ask, ans:m.ans})));
}
function startMapQuiz(modeId){
  state.msession={ mode:modeId, queue:mapQueue(modeId), i:0, correct:0, wrong:[], result:null, curWrong:false, picked:null };
}

function renderMapQuiz(c){
  const s=state.msession, m=mapMode(s.mode);
  if(s.i>=s.queue.length){
    const pct=s.queue.length?Math.round(s.correct/s.queue.length*100):0;
    let h=`<div class="stage summary"><div class="lbl">First-try score</div><div class="big">${pct}%</div>
      <div class="lbl">${s.correct} of ${s.queue.length} right on the first try</div>`;
    if(s.wrong.length){
      h+=`<div class="missed"><div class="sectionhdr">Ones you had to retry</div>`;
      s.wrong.forEach(it=>{ h+=`<div class="m"><span>${flagOf(it.c.cc)} ${esc(it.c.es)}</span><span>${esc(it.c.cap)}</span></div>`; });
      h+=`</div>`;
    }
    h+=`<div class="fbrow">
        ${s.wrong.length?`<button class="pill" id="retry">🔁 Retry the ${s.wrong.length} tricky ones</button>`:``}
        <button class="pill ghost" id="restart">↻ Start over</button>
        <button class="pill ghost" id="done">Done</button>
      </div></div>`;
    c.innerHTML=h;
    if(s.wrong.length) c.querySelector("#retry").onclick=()=>{ state.msession={...s, queue:shuffle(s.wrong), i:0, correct:0, wrong:[], result:null, curWrong:false, picked:null}; render(); };
    c.querySelector("#restart").onclick=()=>{ startMapQuiz(s.mode); render(); };
    c.querySelector("#done").onclick=()=>{ state.msession=null; render(); };
    return;
  }
  const it=s.queue[s.i], k=it.c, pct=Math.round(s.i/s.queue.length*100);
  const kindName = {country:'country', capital:'capital city', map:'on the map'}[it.ans];
  let h=`<div class="stage mapstage">
    <div class="prog"><div class="progtxt">${s.i+1} / ${s.queue.length}</div>
      <div class="progbar"><i style="width:${pct}%"></i></div><div class="progtxt">✓ ${s.correct}</div></div>`;
  // the question
  if(it.ask==='map'){
    h+=`<div class="prompt small">${it.ans==='country' ? 'Which country is this?' : 'What is the capital of this country?'}</div>
        <div class="askside">the ${it.ans==='country'?'highlighted country':'capital of the highlighted country'} · spelling counts</div>
        ${mapSvg({hl:k.iso, names:'region'})}`;
  }else if(it.ask==='country'){
    h+=`<div class="prompt">${flagOf(k.cc)} ${esc(k.es)}</div>
        <div class="askside">${it.ans==='map' ? 'tap it on the map' : 'its capital · spelling counts'}</div>`;
  }else{
    h+=`<div class="prompt">${esc(k.cap)}</div>
        <div class="askside">${it.ans==='map' ? 'tap the country this is the capital of' : 'which country is this the capital of? · spelling counts'}</div>`;
  }
  // the answer
  const okText = it.ans==='map' ? `${flagOf(k.cc)} ${k.es} (${k.en}) · ${k.cap}` : mapAnswerText(k, it.ans);
  if(it.ans==='map'){
    const wrongPick = s.result==='wrong' ? mapCountry(s.picked) : null;
    h+=mapSvg({click:s.result===null, ok:s.result?k.iso:null, no:wrongPick?wrongPick.iso:null, names:'region'});
    if(s.result==='right') h+=`<div class="feedback good">✓ ¡Correcto!<span class="corr"><b>${esc(okText)}</b></span></div>
      <div class="fbrow"><button class="pill" id="next">Next →</button></div>`;
    else if(s.result==='wrong') h+=`<div class="feedback bad">✕ That was ${flagOf(wrongPick.cc)} ${esc(wrongPick.es)}<span class="corr"><b>${esc(k.es)}</b> is the one in green</span></div>
      <div class="fbrow"><button class="pill" id="next">Next →</button></div>`;
  }else if(s.result==='right'){
    h+=`<div class="feedback good">✓ ¡Correcto!<span class="corr"><b>${esc(okText)}</b></span></div>
      <div class="fbrow"><button class="pill" id="next">Next →</button></div>`;
  }else{
    h+=`<div class="answer">
        <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${it.ans==='capital'?'the capital…':'the country…'}">
        <button class="pill" id="check">Check</button>
      </div>
      <div class="accents">${ACCENTS.map(ch=>`<button class="accbtn" data-ch="${ch}">${ch}</button>`).join('')}</div>`;
    if(s.result==='wrong') h+=`<div class="feedback bad">✕ Not quite<span class="corr"><b>${esc(okText)}</b>${k.note&&it.ans==='capital'?` — ${esc(k.note)}`:''}</span></div>`;
  }
  h+=`</div>`;
  c.innerHTML=h;
  const next=()=>{ s.i++; s.result=null; s.curWrong=false; s.picked=null; render(); window.scrollTo(0,0); };
  if(s.result==='right' || (s.result==='wrong' && it.ans==='map')){ c.querySelector("#next").onclick=next; return; }
  if(it.ans==='map'){
    wireMapClicks(c, iso=>{
      if(iso===k.iso){ if(!s.curWrong) s.correct++; s.result='right'; }
      else { s.wrong.push(it); s.curWrong=true; s.picked=iso; s.result='wrong'; }
      render();
    });
    return;
  }
  const inp=c.querySelector("#ans");
  const submit=()=>{
    if(mapCheck(inp.value, k, it.ans)){ if(!s.curWrong) s.correct++; s.result='right'; }
    else { if(!s.curWrong){ s.wrong.push(it); s.curWrong=true; } s.result='wrong'; }
    render();
  };
  c.querySelector("#check").onclick=submit;
  inp.onkeydown=e=>{ if(e.key==='Enter') submit(); };
  c.querySelectorAll(".accbtn").forEach(b=>b.onclick=()=>{ inp.value+=b.dataset.ch; inp.focus(); });
  inp.focus();
}

const _PRON = {yo:'me',tu:'te',el:'se',nos:'nos',vos:'os',ellos:'se'};
const _withPron = (reflexive, f) => reflexive ? Object.fromEntries(Object.entries(f).map(([k,v])=>[k, _PRON[k]+' '+v])) : f;
// fill-in item: "Yo ___ (ir) a la selva." → fui

// English → Spanish, with or without the subject pronoun
const _SUBJ = {I:'yo', You:'tú', He:'él', She:'ella', We:'nosotros', "Y'all":'vosotros', They:'ellos'};
const tr = (en, es, why) => { const who = _SUBJ[en.split(' ')[0]];
  return { ask:en, hint:'say it in Spanish', answer: who ? `${es} / ${who} ${es}` : es, why }; };

// Regular preterite (Unit 8). Only yo changes spelling for -car / -gar / -zar.
function pretReg(inf){
  const refl = inf.endsWith('se'), b = refl ? inf.slice(0,-2) : inf, stem = b.slice(0,-2), end = b.slice(-2);
  const E = end==='ar' ? ['é','aste','ó','amos','asteis','aron'] : ['í','iste','ió','imos','isteis','ieron'];
  let yoStem = stem;
  if(end==='ar') yoStem = stem.replace(/c$/,'qu').replace(/g$/,'gu').replace(/z$/,'c');
  const f = Object.fromEntries(FORMS.map((k,i)=>[k, (i===0?yoStem:stem)+E[i]]));
  return _withPron(refl, f);
}
// I → Y preterite (Unit 9): -uir verbs, and leer / creer / oír / poseer / caer with the extra accents.
function pretIY(inf){
  const refl = inf.endsWith('se'), b = refl ? inf.slice(0,-2) : inf, stem = b.slice(0,-2);
  const E = b.endsWith('uir') ? ['í','iste','yó','imos','isteis','yeron'] : ['í','íste','yó','ímos','ísteis','yeron'];
  return _withPron(refl, Object.fromEntries(FORMS.map((k,i)=>[k, stem+E[i]])));
}

// Present perfect (Unit 7): haber + past participle.
const HABER = {yo:'he',tu:'has',el:'ha',nos:'hemos',vos:'habéis',ellos:'han'};
const PARTICIPLES = { abrir:'abierto', cubrir:'cubierto', decir:'dicho', devolver:'devuelto', escribir:'escrito', freír:'frito',
  hacer:'hecho', morir:'muerto', poner:'puesto', resolver:'resuelto', romper:'roto', ver:'visto', volver:'vuelto' };
function participle(inf){
  const b = inf.replace(/se$/,'');
  if(PARTICIPLES[b]) return PARTICIPLES[b];
  if(/(aer|eer|oír)$/.test(b)) return b.slice(0,-2) + 'ído';   // creído, leído, oído, traído
  return b.slice(0,-2) + (b.endsWith('ar') ? 'ado' : 'ido');
}

// make an adjective agree: -o/-a for gender; plural adds -s after a vowel, -es after a consonant
function agree(adj, g, pl){
  let w = /o$/.test(adj) ? adj.slice(0,-1) + (g==='f' ? 'a' : 'o') : adj;
  if(pl) w += /[aeiouáéíóú]$/.test(w) ? 's' : 'es';

}
function agreeWhy(adj, g, pl, mixed){
  const bits=[];

  if(/o$/.test(adj)) bits.push(g==='f' ? '-o adjectives end in -a for a feminine noun.' : '-o adjectives keep -o for a masculine noun.');
  else bits.push(`Adjectives ending in ${/[aeiouáéíóú]$/.test(adj)?'-e':'a consonant'} don't change for gender.`);
  if(pl) bits.push(/[aeiouáéíóú]$/.test(adj) ? 'Plural: add -s after a vowel.' : 'Plural: add -es after a consonant.');
  else bits.push('Singular: no ending added.');
  return bits.join(' ');
}

function renderLevels(){
  const lv = state.level || 3;
  document.getElementById("levelbar").innerHTML = `<span class="lb-title">🇪🇸 Spanish</span><div class="levels">${LEVELS.map(n=>
    `<button class="level ${n===lv?'active':''}" data-level="${n}">Spanish ${n}${READY.includes(n)?'':'<small>soon</small>'}</button>`).join('')}</div>`;
  document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>switchLevel(+b.dataset.level));
  const ready = READY.includes(lv), soon = document.getElementById("soon");
  soon.hidden = ready; document.getElementById("wrap").hidden = !ready; document.getElementById("soonCredit").hidden = ready;
  document.title = `Spanish Study Tool`;
  if(!ready) soon.innerHTML = `<div class="card"><div class="big">🚧</div><h2>Spanish ${lv}: coming soon</h2>
    <p>This level is still being built. Spanish 2 and 3 are ready to study now.</p><button class="pill" data-level="2">Go to Spanish 2</button> <button class="pill" data-level="3">Go to Spanish 3</button></div>`;
  soon.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>switchLevel(+b.dataset.level));
  return ready;
}
// a fresh start in the new level: its own units, verbs and drills
function switchLevel(n){
  if(n === (state.level||3)) return;
  state.level = n;
  if(READY.includes(n)) useLevel(n);
  Object.assign(state, { unitIdx:0, view:"unit", section:"All", week:"All", expanded:false, pstep:null, vcat:"all",
    tsession:null, gtopic:null, gsession:null, ctopic:null, fsession:null, cstep:null, cselected:null, csession:null, msession:null, mpick:null, selected:null, session:null });
  render(); window.scrollTo(0,0);
}
function render(){ if(renderLevels()){ renderSidebar(); renderTop(); renderContent(); } save(); }

function renderSidebar(){
  const sb=document.getElementById("sidebar");
  let h=`<div class="brand"><span class="flag">🇪🇸</span><div><h1>Spanish Study Tool</h1><small>Spanish ${state.level||3}</small></div></div>`;
  h+=`<div class="side-label">Units</div>`;
  DATA.units.forEach((u,i)=>{
    const n=u.sets.reduce((a,s)=>a+s.words.length,0) || (u.map?MAP_COUNTRIES.length:0);
    const theme=(u.name.split('—')[1]||'').trim();
    const active=i===state.unitIdx;
    h+=`<div class="unit-row">
          <button class="navbtn unit-tab ${active?'active':''}" data-unit="${i}">
            <span class="dot"></span>
            <span class="ut-label">${esc(unitLabel(u))}${theme?`<small>${esc(theme)}</small>`:''}</span>
            <span class="cnt">${n}</span>
          </button>
          <button class="ut-caret" data-toggle="${i}" title="Show Vocab & Verbs">${active&&state.expanded?'▾':'▸'}</button>
        </div>`;
    if(active && state.expanded){
      [...(u.map?[['map','🗺️ Map']]:[]),['vocab','📚 Vocab'],['verbs','🔀 Verbs'],['grammar','🧩 Grammar'],['culture','🌎 Culture']].forEach(([key,label])=>{
        const on = state.view===key || (key==='vocab' && state.view==='section');
        h+=`<button class="navbtn sub ${on?'active':''}" data-view="${key}"><span class="dot"></span>${label}</button>`;
      });
    }
  });
  h+=`<div class="side-foot">Tap a set inside the unit, then Review → Practice. Everything auto-saves.</div>`;
  sb.innerHTML=h;
  sb.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{state.unitIdx=+b.dataset.unit; state.view="unit"; state.section="All"; state.session=null; state.msession=null; state.mpick=null; render();});
  sb.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{state.unitIdx=+b.dataset.toggle; state.expanded=!state.expanded; render();});
  sb.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
    state.view=b.dataset.view; state.session=null; state.msession=null; render();
  });
}

function renderTop(){
  const t=document.getElementById("topbar");
  const dirLabel = state.direction==="es2en" ? "Español → English" : "English → Español";
  const uTheme=(unit().name.split('—')[1]||'').trim();
  if(state.view==="unit"){
    t.innerHTML=`<div><h2>${unitLabel()}${uTheme?` — ${esc(uTheme)}`:''}</h2><div class="sub">Choose what to study</div></div>`;
    return;
  }
  if(state.view==="map"){
    const inQuiz = !!state.msession, m = inQuiz ? mapMode(state.msession.mode) : null;
    t.innerHTML=`
      <button class="backbtn" id="back">← ${inQuiz ? 'Map' : unitLabel()}</button>
      <div><h2>${inQuiz ? esc(m.name) : 'Map'}</h2>
      <div class="sub">${inQuiz ? esc(m.desc) : `${MAP_COUNTRIES.length} Spanish-speaking countries · names and capitals`}</div></div>`;
    t.querySelector("#back").onclick=()=>{ if(inQuiz) state.msession=null; else state.view="unit"; render(); };
    return;
  }
  if(state.view==="grammar"){
    const inDrill = !!state.gsession;
    const g = inDrill ? GRAMMAR.find(x=>x.id===state.gsession.drill) : null;
    t.innerHTML=`
      <button class="backbtn" id="back">← ${inDrill ? 'Grammar' : unitLabel()}</button>
      <div><h2>${inDrill ? esc(g.name) : 'Grammar'}</h2>
      <div class="sub">${inDrill ? esc(g.blurb) : esc(grammarHere().map(x=>x.name).join(' · ') || 'Drills for this unit')}</div></div>`;
    t.querySelector("#back").onclick=()=>{ if(inDrill){ state.gsession=null; state.gtopic=null; } else state.view="unit"; render(); };
    return;
  }
  if(state.view==="culture"){
    const inQuiz = !!state.fsession, inTopic = !!state.ctopic;
    t.innerHTML=`
      <button class="backbtn" id="back">← ${inQuiz||inTopic ? 'Culture' : unitLabel()}</button>
      <div><h2>${inQuiz ? 'Match the facts' : inTopic ? 'Topic' : 'Culture'}</h2>
      <div class="sub">${cultureHere().length} topic${cultureHere().length===1?'':'s'} · ${factCount()} facts</div></div>`;
    t.querySelector("#back").onclick=()=>{
      if(inQuiz) state.fsession=null; else if(inTopic) state.ctopic=null; else state.view="unit";
      render();
    };
    return;
  }
  if(state.view==="verbs"){
    // Back leaves the type quiz before it leaves the Verbs section, so it
    // isn't a one-way door out of the whole area.
    const inType = !!state.tsession;
    t.innerHTML=`
      <button class="backbtn" id="back">← ${inType ? 'Verbs' : unitLabel()}</button>
      <div><h2>${inType ? 'Which type is it?' : 'Verbs'}</h2>
      <div class="sub">${inType ? 'Regular · boot · irregular' : 'Conjugation practice'}</div></div>`;
    t.querySelector("#back").onclick=()=>{ if(inType) state.tsession=null; else state.view="unit"; render(); };
    return;
  }
  if(state.view==="vocab"){
    t.innerHTML=`
      <button class="backbtn" id="back">← ${unitLabel()}</button>
      <div><h2>Vocabulary</h2><div class="sub">Choose a set</div></div>`;
    t.querySelector("#back").onclick=()=>{state.view="unit"; render();};
    return;
  }
  if(state.view==="conjugate"){
    t.innerHTML=`
      <button class="backbtn" id="back">← Verbs</button>
      <div><h2>${esc(VCAT_LABEL[state.vcat]||'Verbs')}</h2><div class="sub">Conjugation</div></div>`;
    t.querySelector("#back").onclick=()=>{state.view="verbs"; state.cstep=null; state.csession=null; render();};
    return;
  }
  t.innerHTML=`
    <button class="backbtn" id="back">← Vocab</button>
    <div><h2>${esc(state.week)}</h2><div class="sub">${allWords().length} words</div></div>`;
  t.querySelector("#back").onclick=()=>{state.view="vocab"; state.pstep=null; state.session=null; render();};
}

function renderContent(){
  const c=document.getElementById("content");
  if(state.view==="unit") return renderUnitHome(c);
  if(state.view==="map") return state.msession ? renderMapQuiz(c) : renderMapHome(c);
  if(state.view==="vocab") return renderVocabHome(c);
  if(state.view==="verbs") return state.tsession ? renderTypeQuiz(c) : renderVerbHome(c);
  if(state.view==="grammar") return state.gsession ? renderGrammarQuiz(c) : renderGrammarHome(c);
  if(state.view==="culture") return state.fsession ? renderFactQuiz(c)
    : state.ctopic ? renderCultureTopic(c) : renderCultureHome(c);
  if(state.view==="conjugate") return renderConjugate(c);
  // Vocab study view (a week): word list → Practice → exclude → direction → quiz
  if(state.pstep==="exclude") return renderExclude(c);
  if(state.pstep==="direction") return renderDirection(c);
  if(state.pstep==="quiz") return renderQuiz(c);
  return renderWordList(c);
}

/* -------- Word list (like the sheet) + Practice button -------- */
function groupedWords(withBox){
  ensureSelectedObj();
  const words=allWords();
  let h="";
  unit().sets.forEach(set=>{
    const inSec=words.filter(w=>w.section===set.name);
    if(!inSec.length) return;
    h+=`<div class="sectionhdr">${esc(set.name)}</div><div class="wordgrid">`;
    inSec.forEach(w=>{
      const on=isSel(w);
      h+=`<div class="wcard ${withBox?(on?'on':'off'):'read'}" ${withBox?`data-k="${esc(key(w))}"`:''}>
            ${withBox?`<span class="box">${on?'✓':''}</span>`:''}
            <div class="txt"><div class="es">${esc(w.es)}</div><div class="en">${esc(w.en)}</div></div>
          </div>`;
    });
    h+=`</div>`;
  });
  return h;
}
function renderWordList(c){
  const words=allWords();
  if(words.length===0){
    c.innerHTML=`<div class="empty"><div class="em">📭</div>No words in <b>${esc(state.week)}</b> yet.<br>Tell me which words go here and I'll add them.</div>`;
    return;
  }
  c.innerHTML=`<button class="btn practicebtn" id="startPractice">✍️ Practice</button>${groupedWords(false)}`;
  c.querySelector("#startPractice").onclick=()=>{ ensureSelectedObj(); state.pstep="exclude"; render(); };
}

/* -------- Step 1: choose what to leave out -------- */
function renderExclude(c){
  ensureSelectedObj();
  const words=allWords();
  const incl=words.filter(isSel).length;
  c.innerHTML=`
    <button class="back" id="pback">‹ Back</button>
    <h2 class="ptitle">Anything you don't want quizzed?</h2>
    <p class="psub">Everything's in by default. Tap a word to <b>leave it out</b>.</p>
    <div class="toolbar"><button class="btn" id="inclAll">Select all</button><button class="btn subtle" id="exclAll">Deselect all</button><span class="count">${incl} of ${words.length} in</span></div>
    ${groupedWords(true)}
    <button class="btn practicebtn" id="toDir" ${incl?'':'disabled'}>Continue →</button>`;
  c.querySelectorAll(".wcard[data-k]").forEach(el=>el.onclick=()=>{ const k=el.dataset.k; state.selected[k]=!state.selected[k]; render(); });
  c.querySelector("#pback").onclick=()=>{ state.pstep=null; render(); };
  c.querySelector("#inclAll").onclick=()=>{ words.forEach(w=>state.selected[key(w)]=true); render(); };
  c.querySelector("#exclAll").onclick=()=>{ words.forEach(w=>state.selected[key(w)]=false); render(); };
  c.querySelector("#toDir").onclick=()=>{ state.pstep="direction"; render(); };
}

/* -------- Step 2: direction -------- */
function renderDirection(c){
  const opts=[
    ["es2en","🇪🇸 → 🇬🇧","Spanish → English","See Spanish, type the English"],
    ["en2es","🇬🇧 → 🇪🇸","English → Spanish","See English, type the Spanish"],
    ["mix","🔀","Mix","A random mix of both directions"],
  ];
  c.innerHTML=`
    <button class="back" id="pback">‹ Back</button>
    <h2 class="ptitle">How do you want to be quizzed?</h2>
    <div class="dirlist">${opts.map(([k,ic,t,d])=>`
      <button class="dircard" data-dir="${k}"><span class="di">${ic}</span>
        <div class="dtx"><div class="dt">${t}</div><div class="dd">${d}</div></div><span class="go">→</span></button>`).join('')}</div>`;
  c.querySelector("#pback").onclick=()=>{ state.pstep="exclude"; render(); };
  c.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{ state.pdir=b.dataset.dir; startQuiz(); state.pstep="quiz"; render(); });
}

/* -------- Step 3: the quiz -------- */
function startQuiz(){
  const pool=selectedWords();
  const q=shuffle(pool).map(w=>({ w, dir: state.pdir==="mix" ? (Math.random()<0.5?"es2en":"en2es") : state.pdir }));
  state.session={ queue:q, i:0, correct:0, wrong:[], result:null, curWrong:false };
}
function renderQuiz(c){
  const s=state.session;
  if(!s){ state.pstep=null; return render(); }

  // Summary
  if(s.i>=s.queue.length){
    const pct=s.queue.length?Math.round(s.correct/s.queue.length*100):0;
    let h=`<div class="stage summary">
      <div class="lbl">First-try score</div><div class="big">${pct}%</div>
      <div class="lbl">${s.correct} of ${s.queue.length} right on the first try</div>`;
    if(s.wrong.length){
      h+=`<div class="missed"><div class="sectionhdr">Words you had to retry</div>`;
      s.wrong.forEach(it=>{h+=`<div class="m"><span>${esc(it.w.es)}</span><span>${esc(it.w.en)}</span></div>`;});
      h+=`</div>`;
    }
    h+=`<div class="fbrow">
        ${s.wrong.length?`<button class="pill" id="retry">🔁 Retry the ${s.wrong.length} tricky ones</button>`:``}
        <button class="pill ghost" id="restart">↻ Start over</button>
        <button class="pill ghost" id="done">Done</button>
      </div></div>`;
    c.innerHTML=h;
    if(s.wrong.length) c.querySelector("#retry").onclick=()=>{ state.session={queue:shuffle(s.wrong),i:0,correct:0,wrong:[],result:null,curWrong:false}; render(); };
    c.querySelector("#restart").onclick=()=>{ startQuiz(); render(); };
    c.querySelector("#done").onclick=()=>{ state.pstep=null; state.session=null; render(); };
    return;
  }

  const it=s.queue[s.i], w=it.w, dir=it.dir;
  const answerIsEs = dir==="en2es";
  const prompt = dir==="es2en" ? w.es : w.en;
  const answer = dir==="es2en" ? w.en : w.es;
  const pct=Math.round(s.i/s.queue.length*100);
  const askLang = answerIsEs ? "Escribe en español (con el / la)" : "Type the English";

  let h=`<div class="stage">
    <div class="prog"><div class="progtxt">${s.i+1} / ${s.queue.length}</div>
      <div class="progbar"><i style="width:${pct}%"></i></div><div class="progtxt">✓ ${s.correct}</div></div>
    <div class="qmeta">${esc(w.section)} · ${dir==="es2en"?"ES → EN":"EN → ES"}</div>
    <div class="prompt">${esc(prompt)}</div>
    <div class="askside">${askLang}</div>`;

  if(s.result==="right"){
    h+=`<div class="feedback good">✓ ¡Correcto!<span class="corr">${esc(prompt)} = <b>${esc(answer)}</b></span></div>
      <div class="fbrow"><button class="pill" id="next">Next →</button></div>`;
  }else{
    h+=`<div class="answer">
        <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="your answer…">
        <button class="pill" id="check">Check</button>
      </div>`;
    if(answerIsEs){
      h+=`<div class="accents">${ACCENTS.map(ch=>`<button class="accbtn" data-ch="${ch}">${ch}</button>`).join('')}</div>`;
    }
    if(s.result==="wrong"){
      h+=`<div class="feedback bad">✕ Not quite — try again<span class="corr">Correct answer: <b>${esc(answer)}</b></span></div>`;
    }
  }
  h+=`</div>`;
  c.innerHTML=h;

  if(s.result==="right"){
    const next=()=>{ s.i++; s.result=null; s.curWrong=false; render(); };
    c.querySelector("#next").onclick=next;
    document.addEventListener("keydown", function onk(e){ if(e.key==="Enter"){ document.removeEventListener("keydown",onk); next(); } });
  }else{
    const inp=c.querySelector("#ans"); inp.focus();
    c.querySelectorAll(".accbtn").forEach(b=>b.onclick=()=>insertChar(b.dataset.ch));
    const submit=()=>{
      if(checkAns(inp.value, answer, answerIsEs)){
        if(!s.curWrong) s.correct++;
        s.result="right";
      }else{
        if(!s.curWrong){ s.curWrong=true; s.wrong.push(it); }
        s.result="wrong";
      }
      render();
    };
    c.querySelector("#check").onclick=submit;
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
  }
}

/* -------- Vocab home: All / Semana 1 / Semana 2 boxes -------- */
function countWeek(n){ let c=0; unit().sets.forEach(s=>s.words.forEach(w=>{ if(weeksOf(w).includes(n)) c++; })); return c; }
function renderVocabHome(c){
  const boxes=[
    {week:'All', ic:'📚', label:'All', count:unit().sets.reduce((a,s)=>a+s.words.length,0), all:true},
    ...weeksInUnit().map(n=>(typeof n === 'number'
      ? { week:`Semana ${n}`, ic:WEEK_ICONS[n-1]||"📅", label:`Semana ${n}`, count:countWeek(n) }
      : { week:n, ic:GROUP_ICONS[n]||"🗂️", label:n, count:countWeek(n) })),
  ];
  c.innerHTML=`<div class="hub">${boxes.map(b=>`
    <div class="hubcard bigcard ${b.all?'allcard':''}" data-week="${esc(b.week)}">
      <span class="go">→</span>
      <span class="ic big">${b.ic}</span>
      <h3>${b.label}</h3>
      <div class="meta">${b.count} word${b.count===1?'':'s'}</div>
    </div>`).join('')}</div>`;
  c.querySelectorAll("[data-week]").forEach(el=>el.onclick=()=>{ state.week=el.dataset.week; state.view='section'; state.pstep=null; state.session=null; render(); });
}

/* -------- Grammar: gustar and possessives -------- */
const grammarHere = () => GRAMMAR.filter(g => g.unit === unit().id);

function renderGrammarHome(c){
  const drills = grammarHere();
  if(drills.length===0){
    c.innerHTML=`<div class="empty"><div class="em">🧩</div>No grammar drills for this unit yet.<br>Tell me the topic and I'll add one.</div>`;
    return;
  }
  c.innerHTML=`<div class="hub">${drills.map(g=>`
    <div class="hubcard bigcard" data-drill="${esc(g.id)}">
      <span class="go">→</span><span class="ic big">${g.emoji}</span>
      <h3>${esc(g.name)}</h3><div class="meta">${esc(g.blurb)}</div>
    </div>`).join('')}</div>`;
  c.querySelectorAll("[data-drill]").forEach(el=>el.onclick=()=>{
    const g=GRAMMAR.find(x=>x.id===el.dataset.drill);
    state.gtopic=g.id;
    state.gsession={ drill:g.id, queue:g.build(), i:0, correct:0, wrong:[], result:null, curWrong:false };
    render();
  });
}
function renderGrammarQuiz(c){
  const s=state.gsession, g=GRAMMAR.find(x=>x.id===s.drill);
  if(s.i>=s.queue.length){
    const pct=s.queue.length?Math.round(s.correct/s.queue.length*100):0;
    let h=`<div class="stage summary"><div class="lbl">First-try score</div><div class="big">${pct}%</div>
      <div class="lbl">${s.correct} of ${s.queue.length} right on the first try</div>`;
    if(s.wrong.length){
      h+=`<div class="missed"><div class="sectionhdr">Ones you had to retry</div>`;
      s.wrong.forEach(it=>{ h+=`<div class="m"><span>${esc(it.ask)}</span><span>${esc(it.answer)}</span></div>`; });
      h+=`</div>`;
    }
    h+=`<div class="fbrow">
        ${s.wrong.length?`<button class="pill" id="retry">🔁 Retry the ${s.wrong.length} tricky ones</button>`:``}
        <button class="pill ghost" id="restart">↻ Start over</button>
        <button class="pill ghost" id="done">Done</button>
      </div></div>`;
    c.innerHTML=h;
    if(s.wrong.length) c.querySelector("#retry").onclick=()=>{ state.gsession={drill:s.drill,queue:shuffle(s.wrong),i:0,correct:0,wrong:[],result:null,curWrong:false}; render(); };
    c.querySelector("#restart").onclick=()=>{ state.gsession={drill:g.id,queue:g.build(),i:0,correct:0,wrong:[],result:null,curWrong:false}; render(); };
    c.querySelector("#done").onclick=()=>{ state.gsession=null; state.gtopic=null; render(); };
    return;
  }
  const it=s.queue[s.i], pct=Math.round(s.i/s.queue.length*100);
  let h=`<div class="stage">
    <div class="prog"><div class="progtxt">${s.i+1} / ${s.queue.length}</div>
      <div class="progbar"><i style="width:${pct}%"></i></div><div class="progtxt">✓ ${s.correct}</div></div>
    <div class="prompt">${esc(it.ask)}</div>
    <div class="askside">${esc(it.hint)}</div>`;
  if(s.result==='right'){
    h+=`<div class="feedback good">✓ ¡Correcto!<span class="corr"><b>${esc(it.answer)}</b></span></div>
      <div class="fbrow"><button class="pill" id="next">Next →</button></div>`;
  }else if(it.choices){
    h+=`<div class="dirlist">${it.choices.map(([val,ic])=>
      `<button class="dircard" data-choice="${esc(val)}"><span class="di">${ic}</span>
        <div class="dtx"><div class="dt">${esc(val)}</div></div><span class="go">→</span></button>`).join('')}</div>`;
    if(s.result==='wrong'){
      h+=`<div class="feedback bad">✕ Not quite<span class="corr"><b>${esc(it.answer)}</b> — ${esc(it.why)}</span></div>`;
    }
  }else{
    h+=`<div class="answer">
        <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="write it out…">
        <button class="pill" id="check">Check</button>
      </div>
      <div class="accents">${ACCENTS.map(ch=>`<button class="accbtn" data-ch="${ch}">${ch}</button>`).join('')}</div>`;
    if(s.result==='wrong'){
      h+=`<div class="feedback bad">✕ Not quite<span class="corr"><b>${esc(it.answer)}</b> — ${esc(it.why)}</span></div>`;
    }
  }
  h+=`</div>`;
  c.innerHTML=h;
  if(s.result==='right'){
    c.querySelector("#next").onclick=()=>{ s.i++; s.result=null; s.curWrong=false; render(); };
    return;
  }
  const mark=(val)=>{
    if(checkAns(val, it.answer, true)){ if(!s.curWrong) s.correct++; s.result='right'; }
    else { if(!s.curWrong){ s.wrong.push(it); s.curWrong=true; } s.result='wrong'; }
    render();
  };
  if(it.choices){
    c.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>mark(b.dataset.choice));
    return;
  }
  const inp=c.querySelector("#ans");
  const submit=()=>{
    if(checkAns(inp.value, it.answer, true)){ if(!s.curWrong) s.correct++; s.result='right'; }
    else { if(!s.curWrong){ s.wrong.push(it); s.curWrong=true; } s.result='wrong'; }

  };
  c.querySelector("#check").onclick=submit;

  c.querySelectorAll(".accbtn").forEach(b=>b.onclick=()=>{ inp.value+=b.dataset.ch; inp.focus(); });
  inp.focus();
}

const TYPE_LABEL={regular:'Regular', boot:'Boot verb', irregular:'Irregular'};
// Why each answer is what it is, so a wrong guess teaches something.
const TYPE_WHY={
  regular:'Keeps its stem and takes the plain -ar/-er/-ir endings all the way through.',
  boot:'The stem changes in every form except nosotros and vosotros — the shape that change makes on the chart is the boot.',
  irregular:'Does its own thing; the forms have to be learned rather than worked out.',

function startTypeQuiz(){
  state.tsession={ queue:shuffle(VERBS_CONJ), i:0, correct:0, wrong:[], result:null, curWrong:false };

    <div class="askside">${esc(v.en)}</div>`;
  if(s.result){
    const right=s.result==='right';
    // The chart in its usual shape — singular down the left, plural down the
    // right. On a boot verb the four changing cells are the ones lit up, which
    // is the boot you can see.
    const f=conjugate(v);
    const rows=[['yo','yo',true],['tú','tu',true],['él/ella','el',true],
                ['nosotros','nos',false],['vosotros','vos',false],['ellos','ellos',true]];
    const order=[0,3,1,4,2,5];

    }).join('');
    h+=`<div class="feedback ${right?'good':'bad'}">${right?'✓ ¡Correcto!':'✕ Not quite'}
        <span class="corr"><b>${esc(v.inf)}</b> is ${TYPE_LABEL[v.type].toLowerCase()} — ${TYPE_WHY[v.type]}</span></div>
      <div class="conjgrid">${cells}</div>
      ${v.type==='boot'?`<div class="bootnote">The four highlighted forms change stem — nosotros and vosotros don't. That's the boot.</div>`:''}
      <div class="fbrow"><button class="pill" id="next">Next →</button></div>`;
  }else{
    h+=`<div class="dirlist">${['regular','boot','irregular'].map(t=>
      `<button class="dircard" data-type="${t}"><span class="di">${t==='regular'?'✅':t==='boot'?'🥾':'⚡'}</span>
        <div class="dtx"><div class="dt">${TYPE_LABEL[t]}</div></div><span class="go">→</span></button>`).join('')}</div>`;
  }
  h+=`</div>`;
  c.innerHTML=h;
  if(s.result){
    c.querySelector("#next").onclick=()=>{ s.i++; s.result=null; s.curWrong=false; render(); };
  }else{
    c.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{
      if(b.dataset.type===v.type){ if(!s.curWrong) s.correct++; s.result='right'; }
      else { if(!s.curWrong){ s.wrong.push(v); s.curWrong=true; } s.result='wrong'; }
      render();
    });
  }
}

function renderCDisplay(c){
  const opts=[['es','🇪🇸','Spanish','Prompts like "ella · preferir"'],['en','🇬🇧','English','Prompts like "she · to prefer"'],['mix','🔀','Mix','A random mix of both']];

function startCQuiz(){
  const pickLang = () => state.cdisp==='mix' ? (Math.random()<0.5?'es':'en') : state.cdisp;
  const verbs = cIncluded();
  let q;
  if(state.ccover==='mixed'){
    // One pronoun per verb. The ending is dealt from a shuffled cycle of all six
    // rather than picked at random, so even a short review spreads across the
    // endings instead of leaning on whichever ones have the most subjects.
    let cycle=[];
    q = shuffle(verbs).map(v=>{
      if(!cycle.length) cycle=shuffle(FORMS);
      const form=cycle.pop();
      return { v, subj: pickSubj(form), lang: pickLang() };
    });
  }else{
    // Every verb is asked once per ending — yo, tú, él, nosotros, vosotros, ellos —
    // with a different subject drawn from that ending's group each time.
    const perVerb = verbs.map(v =>
      shuffle(FORMS).map(form => ({ v, subj: pickSubj(form), lang: pickLang() }))
    );
    // Deal one round at a time so the same verb never comes up back-to-back.
    q=[];
    for(let r=0; r<FORMS.length; r++) shuffle(perVerb.map(list=>list[r])).forEach(item=>q.push(item));
  }
  state.csession={ queue:q, i:0, correct:0, wrong:[], result:null, curWrong:false };
}

    const submit=()=>{
      if(checkAns(inp.value, answer, true)){ if(!s.curWrong) s.correct++; s.result='right'; }
      else{ if(!s.curWrong){ s.curWrong=true; s.wrong.push(it); } s.result='wrong'; }
      render();
    };
    c.querySelector("#check").onclick=submit;
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
  }
}

/* -------- Vocab hub (boxes) -------- */
const SEC_ICON={"All":"✨","Los Sustantivos":"🧱","Los Adjetivos":"🎨","Los Verbos":"⚡","Las Preguntas":"❓","Otras Palabras":"💬"};
Object.assign(SEC_ICON, {"Items & Purchases":"🛍️","Stores":"🏪","Shopping Verbs":"💳","Stem-Changing Verbs":"🥾",
  "Negative & Affirmative Words":"➕","Question Words":"❓","Other Words":"💬","Getting Ready":"🪥",
  "Things You Need":"🧴","Verbs":"⚡","Animals":"🐾","People":"👪","Toys":"🧸","Adjectives":"🎨","How Often":"🔁",
  "How an Accident Happened":"🤕","Parts of the Body":"💪","Medical Treatments":"🩹","Chore Verbs":"🧹","Chore Things":"🧽",
  "Places in the Home":"🏠","Adjectives & Other Words":"💬","Talking About Movies":"🎬","Making Movies":"🎥","Verbs Like Gustar":"💖",
  "Natural Disasters & Weather":"🌪️","The News":"📰","Fires":"🔥","Rescues":"🚑","Telling a Story":"📖","Driving":"🚗",
  "Driving Advice":"⚠️","Directions":"🧭","Prepositions":"📍","Transportation":"🚌","Nouns":"🧱","Special Events":"🎉","How You Feel":"😊","Other Useful Words":"💬"});
function renderHub(c){
  ensureSelectedObj();
  const all=[]; unit().sets.forEach(s=>s.words.forEach(w=>all.push(w)));
  const boxes=[{name:"All", label:"All words", words:all, all:true}];
  unit().sets.forEach(s=>boxes.push({name:s.name, label:s.name, words:s.words}));
  let h=`<div class="hub">`;
  boxes.forEach(b=>{
    const total=b.words.length, sel=b.words.filter(isSel).length, pct=total?Math.round(sel/total*100):0;
    h+=`<div class="hubcard ${b.all?'allcard':''}" data-sec="${esc(b.name)}">
        <span class="go">→</span>
        <span class="ic">${SEC_ICON[b.name]||"📘"}</span>
        <h3>${esc(b.label)}</h3>
        <div class="meta">${total} words · ${sel} selected</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>`;
  });
  h+=`</div>`;
  c.innerHTML=h;
  c.querySelectorAll("[data-sec]").forEach(el=>el.onclick=()=>{state.section=el.dataset.sec; state.view="section"; state.session=null; render();});
}

/* -------- Review -------- */
function renderReview(c){
  ensureSelectedObj();
  const words=allWords();
  if(words.length===0){
    c.innerHTML=`<div class="empty"><div class="em">📭</div>No words in <b>${esc(state.week)}</b> yet.<br>Tell me which words go here and I'll add them.</div>`;
    return;
  }
  const selCount=words.filter(isSel).length;
  let h=`<div class="toolbar">
      <button class="btn" id="selAll">✓ Select all</button>
      <button class="btn" id="selNone">✕ Clear</button>
      <button class="btn" id="selInvert">↔ Invert</button>
      <span class="count">${selCount} / ${words.length} selected for quizzing</span>
    </div>`;
  // Grouped by category, in the packet's order (Sustantivos, Adjetivos, …).
  unit().sets.forEach(set=>{
    const inSec=words.filter(w=>w.section===set.name);
    if(!inSec.length) return;
    h+=`<div class="sectionhdr">${esc(set.name)}</div><div class="wordgrid">`;
    inSec.forEach(w=>{
      const on=isSel(w);
      h+=`<div class="wcard ${on?'on':'off'}" data-k="${esc(key(w))}">
            <span class="box">${on?'✓':''}</span>
            <div class="txt"><div class="es">${esc(w.es)}</div><div class="en">${esc(w.en)}</div></div>
          </div>`;
    });
    h+=`</div>`;
  });
  c.innerHTML=h;
  c.querySelectorAll(".wcard").forEach(el=>el.onclick=()=>{
    const k=el.dataset.k; state.selected[k]=!state.selected[k]; render();
  });
  c.querySelector("#selAll").onclick=()=>{words.forEach(w=>state.selected[key(w)]=true); render();};
  c.querySelector("#selNone").onclick=()=>{words.forEach(w=>state.selected[key(w)]=false); render();};
  c.querySelector("#selInvert").onclick=()=>{words.forEach(w=>state.selected[key(w)]=!state.selected[key(w)]); render();};
}

/* -------- Practice -------- */
function startSession(list){
  // result: null (awaiting answer) | 'wrong' (retry) | 'right' (advance)
  state.session={ queue:shuffle(list), i:0, correct:0, wrong:[], result:null, curWrong:false };
}
function renderPractice(c){
  const pool=selectedWords();
  if(pool.length===0){
    c.innerHTML=`<div class="empty"><div class="em">📋</div>No words selected yet.<br>Go to <b>Review</b> and check the words you want to be quizzed on.</div>`;
    return;
  }
  if(!state.session){ startSession(pool); }
  const s=state.session;

  // ---- summary ----
  if(s.i>=s.queue.length){
    const pct=Math.round(s.correct/s.queue.length*100);
    let h=`<div class="stage summary">
      <div class="lbl">First-try score</div>
      <div class="big">${pct}%</div>
      <div class="lbl">${s.correct} of ${s.queue.length} right on the first try</div>`;
    if(s.wrong.length){
      h+=`<div class="missed"><div class="sectionhdr">Words you had to retry</div>`;
      s.wrong.forEach(w=>{h+=`<div class="m"><span>${esc(w.es)}</span><span>${esc(w.en)}</span></div>`;});
      h+=`</div>`;
    }
    h+=`<div class="fbrow">
        ${s.wrong.length?`<button class="pill" id="retry">🔁 Practice the ${s.wrong.length} tricky ones</button>`:``}
        <button class="pill ghost" id="restart">↻ Start over</button>
      </div></div>`;
    c.innerHTML=h;
    if(s.wrong.length) c.querySelector("#retry").onclick=()=>{ startSession(s.wrong); render(); };
    c.querySelector("#restart").onclick=()=>{ startSession(pool); render(); };
    return;
  }

  const w=s.queue[s.i];
  const pct=Math.round(s.i/s.queue.length*100);
  const askLang = state.direction==="es2en" ? "Type the English" : "Escribe en español";
  let h=`<div class="stage">
    <div class="prog"><div class="progtxt">${s.i+1} / ${s.queue.length}</div>
      <div class="progbar"><i style="width:${pct}%"></i></div>
      <div class="progtxt">✓ ${s.correct}</div></div>
    <div class="qmeta">${esc(w.section)}</div>
    <div class="prompt">${esc(promptOf(w))}</div>
    <div class="askside">${askLang}</div>`;

  if(s.result==='right'){
    h+=`<div class="feedback good">✓ ¡Correcto!<span class="corr">${esc(promptOf(w))} = <b>${esc(answerOf(w))}</b></span></div>
      <div class="fbrow"><button class="pill" id="next">Next →</button></div>`;
  }else{
    h+=`<div class="answer">
        <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="your answer…">
        <button class="pill" id="check">Check</button>
      </div>`;
    if(s.result==='wrong'){
      h+=`<div class="feedback bad">✕ Not quite — try again<span class="corr">Correct answer: <b>${esc(answerOf(w))}</b></span></div>`;
    }
  }
  h+=`</div>`;
  c.innerHTML=h;

  if(s.result==='right'){
    const next=()=>{ s.i++; s.result=null; s.curWrong=false; render(); };
    c.querySelector("#next").onclick=next;
    document.addEventListener("keydown", function onk(e){ if(e.key==="Enter"){ document.removeEventListener("keydown",onk); next(); } });
  }else{
    const inp=c.querySelector("#ans"); inp.focus();
    const submit=()=>{
      if(isCorrect(inp.value, answerOf(w))){
        if(!s.curWrong) s.correct++;   // only first-try counts toward score
        s.result='right';
      }else{
        if(!s.curWrong){ s.curWrong=true; s.wrong.push(w); }
        s.result='wrong';              // stay on this word, show answer in red
      }
      render();
    };
    c.querySelector("#check").onclick=submit;
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
  }
}

/* -------- Flashcards -------- */
function renderFlash(c){
  const pool=selectedWords();
  if(pool.length===0){
    c.innerHTML=`<div class="empty"><div class="em">🃏</div>No words selected.<br>Pick some in <b>Review</b> first.</div>`;
    return;
  }
  const f=state.flash;
  if(!f.order.length || f.order.length!==pool.length){ f.order=shuffle(pool.map((_,i)=>i)); f.i=0; f.flip=false; }
  const w=pool[f.order[f.i % f.order.length]];
  const front = promptOf(w), back = answerOf(w);
  c.innerHTML=`
    <div class="flash">
      <div class="fcard ${f.flip?'flip':''}" id="fc">
        <div class="face front"><div class="tag">${state.direction==='es2en'?'Español':'English'} · ${esc(w.section)}</div><div class="big">${esc(front)}</div><div class="hint">tap to flip</div></div>
        <div class="face back"><div class="tag">${state.direction==='es2en'?'English':'Español'}</div><div class="big">${esc(back)}</div><div class="hint">tap to flip</div></div>
      </div>
      <div class="flashbar">
        <button class="rounder" id="prev">‹</button>
        <div class="progtxt">${(f.i%f.order.length)+1} / ${f.order.length}</div>
        <button class="rounder" id="next">›</button>
        <button class="rounder" id="shuf" title="Shuffle">🔀</button>
      </div>
    </div>`;
  c.querySelector("#fc").onclick=()=>{ f.flip=!f.flip; render(); };
  c.querySelector("#prev").onclick=e=>{e.stopPropagation(); f.i=(f.i-1+f.order.length)%f.order.length; f.flip=false; render();};
  c.querySelector("#next").onclick=e=>{e.stopPropagation(); f.i=(f.i+1)%f.order.length; f.flip=false; render();};
  c.querySelector("#shuf").onclick=e=>{e.stopPropagation(); f.order=shuffle(f.order); f.i=0; f.flip=false; render();};
}

/* ============================ INIT ============================ */
load(); useLevel(READY.includes(state.level) ? state.level : 3); render();
</script>
