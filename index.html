<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanish 3 Study Tool</title>
<style>
  :root{
    --bg:#f6f4fb; --card:#ffffff; --ink:#3a3550; --muted:#8b86a3;
    --line:#eae6f4; --accent:#e879a6; --accent-d:#d65d8e; --accent2:#7bc9c1;
    --purple:#a98fe0; --good:#4caf82; --good-bg:#e7f7ef; --bad:#e5688a; --bad-bg:#fdeaf1;
    --sidebar:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#f7f2fb,#eef6f6);
    color:var(--ink); min-height:100vh;
  }
  .wrap{display:flex; min-height:100vh}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:260px; flex:0 0 260px; background:var(--sidebar);
    border-right:1px solid var(--line); padding:18px 14px; display:flex; flex-direction:column; gap:6px;
  }
  .brand{display:flex; align-items:center; gap:9px; padding:4px 6px 14px}
  .brand .flag{font-size:26px}
  .brand h1{font-size:17px; margin:0; font-weight:800; letter-spacing:.2px}
  .brand small{display:block; color:var(--muted); font-weight:600; font-size:11px}
  .side-label{font-size:11px; font-weight:800; letter-spacing:.8px; color:var(--muted); text-transform:uppercase; margin:14px 6px 6px}
  .navbtn{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    border:none; background:transparent; color:var(--ink); font-size:14px; font-weight:600;
    padding:9px 11px; border-radius:11px; cursor:pointer; transition:.15s;
  }
  .navbtn:hover{background:#f3eefb}
  .navbtn.active{background:linear-gradient(120deg,#fce4ee,#eee6fb); color:var(--accent-d); box-shadow:inset 0 0 0 1px #f2d8e6}
  .navbtn .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--purple)}
  .navbtn .cnt{margin-left:auto; font-size:11px; color:var(--muted); font-weight:700}
  .sec-btn{font-size:13px; padding:8px 11px}
  .sec-btn.active{background:#eafaf7; color:#2f8f84; box-shadow:inset 0 0 0 1px #cdeee9}
  .sec-btn.active .dot{background:var(--accent2)}
  .side-foot{margin-top:auto; font-size:11px; color:var(--muted); padding:12px 6px 2px; line-height:1.5}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .topbar{
    background:rgba(255,255,255,.75); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:14px 22px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:5;
  }
  .topbar h2{margin:0; font-size:19px; font-weight:800}
  .topbar .sub{color:var(--muted); font-size:12px; font-weight:600; margin-top:1px}
  .spacer{flex:1}
  .tabs{display:flex; gap:4px; background:#f0ebf8; padding:4px; border-radius:12px}
  .tab{border:none; background:transparent; padding:8px 15px; border-radius:9px; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer; transition:.15s}
  .tab.active{background:#fff; color:var(--accent-d); box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .dirtoggle{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--ink)}
  .pill{
    border:none; cursor:pointer; padding:8px 13px; border-radius:20px; font-weight:800; font-size:12.5px;
    background:linear-gradient(120deg,var(--accent),var(--purple)); color:#fff; box-shadow:0 2px 8px rgba(169,143,224,.35);
    display:inline-flex; align-items:center; gap:7px; transition:.15s;
  }
  .pill:hover{filter:brightness(1.03)}
  .pill.ghost{background:#fff; color:var(--accent-d); box-shadow:inset 0 0 0 1.5px #f0d5e2}

  .content{padding:22px; max-width:900px; width:100%; margin:0 auto}

  /* ---------- Review ---------- */
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .toolbar .count{margin-left:auto; font-size:13px; color:var(--muted); font-weight:700}
  .btn{border:none; cursor:pointer; padding:8px 13px; border-radius:10px; font-weight:700; font-size:13px; background:#efeaf8; color:var(--ink); transition:.15s}
  .btn:hover{background:#e6def5}
  .btn.subtle{background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1.5px #e6def5}
  .btn.subtle:hover{background:#f5f1fb; color:var(--ink)}
  .sectionhdr{font-size:12px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--accent-d); margin:18px 2px 8px}
  .wordgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  @media (max-width:640px){ .wordgrid{grid-template-columns:1fr} }
  .wcard{
    display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; cursor:pointer; transition:.12s; user-select:none;
  }
  .wcard:hover{border-color:#e3d5f2}
  .wcard.off{opacity:.45}
  .wcard .box{width:19px;height:19px;border-radius:6px;border:2px solid #d8cdec;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .wcard.on .box{background:var(--accent);border-color:var(--accent)}
  .wcard .es{font-weight:700}
  .wcard .en{color:var(--muted); font-size:13px}
  .wcard .txt{min-width:0}
  .wcard .txt div{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  /* ---------- Vocab hub (boxes) ---------- */
  .navbtn.sub{margin-left:6px}
  .weekbar{display:flex; gap:8px; margin:0 2px 14px; flex-wrap:wrap}
  .wchip{border:1.5px solid var(--line); background:#fff; cursor:pointer; padding:7px 15px; border-radius:20px; font-weight:800; font-size:13px; color:var(--muted)}
  .wchip.on{border-color:var(--accent); background:linear-gradient(120deg,#fce4ee,#eee6fb); color:var(--accent-d)}
  .practicebtn{display:block; width:100%; padding:15px; border-radius:14px; font-size:16px; color:#fff; background:linear-gradient(120deg,var(--accent),var(--purple)); box-shadow:0 8px 20px rgba(169,143,224,.35); margin:0 0 16px}
  .practicebtn:disabled{opacity:.5}
  .ptitle{font-size:22px; font-weight:800; margin:8px 2px 2px}
  .psub{color:var(--muted); font-size:13px; font-weight:600; margin:0 2px 14px}
  .wcard.read{cursor:default}
  .dirlist{display:flex; flex-direction:column; gap:12px; margin-top:8px}
  .dircard{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:16px 18px; cursor:pointer; box-shadow:0 4px 16px rgba(90,70,150,.05); transition:.15s}
  .dircard:hover{border-color:#e3d5f2; transform:translateY(-2px)}
  .dircard.on{border-color:var(--accent-d); background:#faf7ff}
  .dircard .di{font-size:26px}
  .dircard .dtx{flex:1}
  .dircard .dt{font-weight:800; font-size:16px}
  .dircard .dd{font-size:12.5px; color:var(--muted); font-weight:600}
  .dircard .go{color:var(--muted); font-weight:800}
  .accents{display:flex; flex-wrap:wrap; gap:6px; max-width:460px; margin:12px auto 0; justify-content:center}
  .accbtn{border:1.5px solid #e5e2f0; background:#fff; border-radius:10px; min-width:38px; padding:8px 0; font-size:16px; font-weight:700; cursor:pointer; color:var(--ink)}
  .accbtn:hover{background:#f3eefb; border-color:var(--purple)}
  .unit-row{display:flex; align-items:stretch; gap:2px}
  .unit-row .unit-tab{flex:1}
  .ut-caret{border:none; background:transparent; cursor:pointer; color:var(--muted); font-size:13px; padding:0 9px; border-radius:10px; flex:0 0 auto}
  .ut-caret:hover{background:#f3eefb; color:var(--accent-d)}
  .navbtn.unit-tab{padding:11px 12px}
  .ut-label{display:flex; flex-direction:column; line-height:1.2; text-align:left}
  .ut-label small{font-size:11px; font-weight:600; color:var(--muted); margin-top:1px}
  .navbtn.unit-tab.active .ut-label small{color:var(--accent-d)}
  .backbtn{border:none;background:#f0ebf8;color:var(--accent-d);font-weight:800;cursor:pointer;padding:8px 13px;border-radius:10px;font-size:13px}
  .backbtn:hover{background:#e6def5}
  .hub{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px}
  .hubcard{
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 20px 22px;
    cursor:pointer; transition:.15s; position:relative; overflow:hidden; box-shadow:0 4px 18px rgba(120,90,160,.06);
  }
  .hubcard:hover{transform:translateY(-3px); border-color:#e3d5f2; box-shadow:0 12px 26px rgba(120,90,160,.14)}
  .hubcard.allcard{background:linear-gradient(140deg,#fce7f0,#eee6fb); border-color:#f0d8e6}
  .hub.unit-home{grid-template-columns:1fr 1fr; gap:18px; max-width:620px}
  @media (max-width:560px){ .hub.unit-home{grid-template-columns:1fr} }
  .hubcard.bigcard{padding:30px 22px; min-height:170px; display:flex; flex-direction:column; justify-content:center}
  .hubcard.bigcard h3{font-size:21px}
  .ic.big{font-size:44px; margin-bottom:14px}
  .hubcard .ic{font-size:30px; display:block; margin-bottom:12px}
  .hubcard h3{margin:0 0 4px; font-size:17px; font-weight:800}
  .hubcard .meta{color:var(--muted); font-size:13px; font-weight:600}
  .hubcard .bar{height:6px; background:#efeaf8; border-radius:5px; margin-top:14px; overflow:hidden}
  .hubcard .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--purple))}
  .hubcard .go{position:absolute; top:16px; right:18px; color:var(--muted); font-size:18px; font-weight:800}

  /* ---------- Practice ---------- */
  .stage{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:30px 26px; box-shadow:0 8px 30px rgba(120,90,160,.07)}
  .prog{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .progbar{flex:1; height:8px; background:#efeaf8; border-radius:6px; overflow:hidden}
  .progbar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--purple)); width:0; transition:.3s}
  .progtxt{font-size:12px; font-weight:800; color:var(--muted)}
  .qmeta{text-align:center; font-size:12px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--accent2); margin:22px 0 4px}
  .prompt{text-align:center; font-size:40px; font-weight:800; margin:6px 0 4px; line-height:1.15}
  .askside{text-align:center; color:var(--muted); font-size:13px; font-weight:700; margin-bottom:20px}
  .answer{display:flex; gap:10px; max-width:460px; margin:0 auto}
  .answer input{
    flex:1; padding:14px 16px; font-size:17px; border:2px solid #e7ddf3; border-radius:13px; outline:none; transition:.15s;
    font-family:inherit; color:var(--ink);
  }
  .answer input:focus{border-color:var(--purple)}
  .feedback{max-width:460px; margin:16px auto 0; border-radius:14px; padding:14px 16px; text-align:center; font-weight:700}
  .feedback.good{background:var(--good-bg); color:var(--good)}
  .feedback.bad{background:var(--bad-bg); color:var(--bad)}
  .feedback .corr{display:block; font-size:15px; margin-top:4px; color:var(--ink)}
  .feedback.bad .corr{color:var(--bad)} .feedback.bad .corr b{color:var(--bad); font-weight:800}
  .fbrow{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap}
  .summary{text-align:center; padding:14px}
  .summary .big{font-size:52px; font-weight:800; margin:6px 0}
  .summary .lbl{color:var(--muted); font-weight:700}
  .missed{margin:18px auto 0; max-width:520px; text-align:left}
  .missed .m{display:flex; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--line); font-size:14px}
  .missed .m span:last-child{color:var(--muted)}

  /* ---------- Flashcards ---------- */
  .flash{perspective:1200px; max-width:520px; margin:0 auto}
  .fcard{position:relative; height:260px; cursor:pointer; transform-style:preserve-3d; transition:transform .5s; }
  .fcard.flip{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:22px; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:24px; text-align:center; box-shadow:0 10px 34px rgba(120,90,160,.12)}
  .front{background:linear-gradient(150deg,#fff,#faf5ff); border:1px solid var(--line)}
  .back{background:linear-gradient(150deg,#eafaf7,#f2f0ff); border:1px solid #d8efe9; transform:rotateY(180deg)}
  .face .big{font-size:38px; font-weight:800; line-height:1.15}
  .face .tag{font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .face .hint{position:absolute; bottom:14px; font-size:12px; color:var(--muted)}
  .flashbar{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:18px}
  .rounder{width:44px;height:44px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:18px;cursor:pointer;color:var(--ink)}
  .rounder:hover{background:#faf5ff}

  .empty{text-align:center; color:var(--muted); padding:50px 20px}
  .empty .em{font-size:40px; margin-bottom:10px}

  .mobtop{display:none}
  @media (max-width:820px){
    .wrap{flex-direction:column}
    .sidebar{width:auto; flex:none; flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); gap:6px; padding:10px}
    .brand,.side-label,.side-foot{display:none}
    .navbtn{white-space:nowrap; width:auto}
    .navbtn .cnt{display:none}
    .prompt{font-size:32px}
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* ============================ DATA ============================ */
const DATA = {
  units: [
    {
      id:"u1",
      name:"Unit 1 — Robo en la Noche",
      sets:[
        { name:"Los Sustantivos", words:[
          {es:"las alas", en:"wings", week:3},
          {es:"las aves", en:"birds", week:3},
          {es:"el bruto", en:"jerk/rude person", week:3},
          {es:"el caballo", en:"horse", week:3},
          {es:"las cabañas", en:"cabins", week:3},
          {es:"la ciudad", en:"city", week:3},
          {es:"el cuchillo", en:"knife", week:3},
          {es:"la hacienda", en:"farm/ranch/estate", week:3},
          {es:"el huevo", en:"egg", week:3},
          {es:"la jaula", en:"cage", week:3},
          {es:"el juez", en:"judge", week:3},
          {es:"la luna", en:"moon", week:3},
          {es:"la mochila", en:"backpack", week:3},
          {es:"el personaje", en:"character", week:3},
          {es:"la pierna", en:"leg", week:3},
          {es:"la pluma", en:"feather", week:3},
          {es:"el propietario", en:"owner"},
          {es:"el robo", en:"theft/robbery", week:3},
          {es:"la selva", en:"jungle", week:3},
          {es:"la soga", en:"rope", week:3},
          {es:"la sonrisa", en:"smile"},
          {es:"el suelo", en:"ground", week:3},
          {es:"los ticos", en:"people from Costa Rica", week:3},
          {es:"la ventana", en:"window", week:3},
          {es:"la vida", en:"life", week:3},
        ]},
        { name:"Los Adjetivos", words:[
          {es:"alegre", en:"happy"},
          {es:"alto", en:"tall"},
          {es:"bajo", en:"short"},
          {es:"bonito", en:"pretty"},
          {es:"enojado", en:"angry/mad"},
          {es:"feo", en:"ugly"},
          {es:"flaco", en:"skinny/thin"},
          {es:"gordo", en:"fat"},
          {es:"grande", en:"big (size)"},
          {es:"largo", en:"long (length)"},
          {es:"nuevo", en:"new"},
          {es:"pequeño", en:"small (size)"},
          {es:"viejo", en:"old"},
        ]},
        { name:"Los Verbos", words:[
          {es:"abordar", en:"to board"},
          {es:"agarrar", en:"to grab"},
          {es:"bajar", en:"to go down"},
          {es:"besar", en:"to kiss"},
          {es:"caminar", en:"to walk"},
          {es:"casarse (con)", en:"to get married"},
          {es:"contar chistes", en:"to tell jokes"},
          {es:"creer", en:"to believe"},
          {es:"cuidar", en:"to take care of"},
          {es:"dejar", en:"to stop doing/to leave behind"},
          {es:"desayunar", en:"to have/eat breakfast"},
          {es:"funcionar", en:"to work/function"},
          {es:"hay", en:"there is/there are"},
          {es:"llegar", en:"to arrive"},
          {es:"llevar", en:"to take people/to carry/to wear"},
          {es:"llorar", en:"to cry"},
          {es:"manejar", en:"to drive"},
          {es:"matar", en:"to kill"},
          {es:"oír", en:"to hear"},
          {es:"pegar", en:"to hit"},
          {es:"pensar", en:"to think"},
          {es:"querer", en:"to want"},
          {es:"quitar", en:"to take off/remove"},
          {es:"reír", en:"to laugh"},
          {es:"robar", en:"to rob/steal"},
          {es:"salir", en:"to go out/to leave"},
          {es:"sentarse", en:"to sit down"},
          {es:"soltar", en:"to set free"},
          {es:"sonreír", en:"to smile"},
          {es:"tener miedo", en:"to be scared"},
          {es:"tener que", en:"to have to"},
          {es:"tener que ver con", en:"to have to do/deal with"},
          {es:"tocar la puerta", en:"to knock"},
          {es:"tomar", en:"to take (food/drink/transport)"},
          {es:"valer", en:"to be worth"},
          {es:"vender", en:"to sell"},
          {es:"ver", en:"to see"},
          {es:"volar", en:"to fly"},
        ]},
        { name:"Las Preguntas", words:[
          {es:"¿Adónde?", en:"To where?"},
          {es:"¿Cómo?", en:"How?"},
          {es:"¿Cuál?", en:"Which?"},
          {es:"¿Cuándo?", en:"When?"},
          {es:"¿Cuánto/a?", en:"How much?"},
          {es:"¿Cuántos/as?", en:"How many?"},
          {es:"¿De dónde?", en:"From where?"},
          {es:"¿Dónde?", en:"Where?"},
          {es:"¿Por qué?", en:"Why?"},
          {es:"¿Qué?", en:"What?"},
          {es:"¿Quién?", en:"Who?"},
        ]},
        { name:"Otras Palabras", words:[
          {es:"a veces", en:"sometimes", week:3},
          {es:"antes", en:"before", week:3},
          {es:"aparte", en:"besides"},
          {es:"así que", en:"thus/this way/so that"},
          {es:"conmigo", en:"with me", week:3},
          {es:"contigo", en:"with you", week:3},
          {es:"después", en:"after", week:3},
          {es:"hacia", en:"towards", week:3},
          {es:"mientras", en:"while", week:3},
          {es:"para siempre", en:"forever"},
          {es:"porque", en:"because", week:3},
          {es:"por eso", en:"therefore", week:3},
          {es:"siempre", en:"always", week:3},
          {es:"también", en:"also", week:3},
        ]},
      ]
    }
  ]
};

/* ============================ STATE ============================ */
// Weekly groupings from the packet. A set can declare its week outright with
// `week:3`; the two original sets are matched by name so nothing had to change
// when this became data-driven. A word can override its set with its own
// `week:`. Untagged words are in "All" only. Add a week by adding a set with
// a `week:` — the hub picks it up on its own.
DATA.units.forEach(u=>u.sets.forEach(s=>{
  const wk = s.week != null ? s.week
    : /pregunta/i.test(s.name) ? 1
    : /verbo/i.test(s.name) ? 2
    : null;
  if(wk != null) s.words.forEach(w=>{ if(w.week == null) w.week = wk; });
}));

const LS = "spanish3-tool-v1";
let state = {
  unitIdx:0, view:"unit", section:"All", week:"All", mode:"review", direction:"es2en",
  expanded:false,          // are the Unit's subtabs (Vocab/Verbs) shown?
  pstep:null,              // practice flow: null (word list) | 'exclude' | 'direction' | 'quiz'
  pdir:"es2en",            // 'es2en' | 'en2es' | 'mix'
  vcat:"all",              // verb category: 'all' | 'regular' | 'irregular' | 'boot'
  cstep:null,              // conjugation flow: null (list) | 'exclude' | 'coverage' | 'display' | 'quiz'
  cdisp:"es",              // prompt language: 'es' | 'en' | 'mix'
  ccover:"all",            // pronouns per verb: 'all' (all six) | 'mixed' (one each)
  cselected:null,          // which verbs are IN the conjugation quiz
  csession:null,
  selected:null,           // {key:true}  (which words are IN the quiz; default all)
  session:null,
  flash:{order:[], i:0, flip:false}
};
// views: 'unit' (Vocab/Verbs squares) → 'section' (vocab study modes) or 'verbs'
function load(){
  try{ const s=JSON.parse(localStorage.getItem(LS)); if(s) Object.assign(state,s);}catch(e){}
  if(state.view==="hub") state.view="vocab";
  if(state.view==="conjugations") state.view="verbs";
  if(!["unit","vocab","verbs","section","conjugate"].includes(state.view)) state.view="unit";
  state.session=null;
}
function save(){ localStorage.setItem(LS, JSON.stringify({unitIdx:state.unitIdx,view:state.view,section:state.section,week:state.week,mode:state.mode,direction:state.direction,expanded:state.expanded,selected:state.selected})); }

/* ============================ HELPERS ============================ */
const unit = ()=>DATA.units[state.unitIdx];
const key = w => unit().id+"::"+w.es;
const weekNum = label => { const m=/^Semana\s+(\d+)$/.exec(label||""); return m ? +m[1] : null; };
// Every week number that actually has words, in order.
function weeksInUnit(){
  const seen=new Set();
  unit().sets.forEach(s=>s.words.forEach(w=>{ if(w.week!=null) seen.add(w.week); }));
  return [...seen].sort((a,b)=>a-b);
}
const WEEK_ICONS=["1️⃣","2️⃣","3️⃣","4️⃣","5️⃣","6️⃣","7️⃣","8️⃣","9️⃣","🔟"];
function allWords(){ // words for the current week, tagged with their set name
  const wk = weekNum(state.week);   // null = All
  const out=[];
  unit().sets.forEach(set=>{
    set.words.forEach(w=>{
      if(wk && w.week!==wk) return;   // week filter (All = no filter)
      out.push({...w, section:set.name});
    });
  });
  return out;
}
function isSel(w){ if(state.selected===null) return true; return !!state.selected[key(w)]; }
function ensureSelectedObj(){ if(state.selected===null){ state.selected={}; DATA.units.forEach(u=>u.sets.forEach(s=>s.words.forEach(w=>state.selected[u.id+"::"+w.es]=true))); } }
function selectedWords(){ return allWords().filter(isSel); }

function norm(s){
  return (s||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")   // strip accents (ñ->n, á->a)
    .replace(/\(.*?\)/g," ")                            // drop (parentheticals)
    .replace(/[¿?¡!.,;:"']/g," ")
    .replace(/\b(to|el|la|los|las|un|una)\b/g," ")      // drop articles / "to"
    .replace(/[^a-z0-9 ]/g," ")
    .replace(/\s+/g," ").trim();
}
function acceptable(expected){
  const set=new Set();
  expected.replace(/\(.*?\)/g," ").split(/[\/,;]| or /i).forEach(p=>{const n=norm(p); if(n) set.add(n);});
  const whole=norm(expected); if(whole) set.add(whole);
  return set;
}
function isCorrect(userText, expected){
  const u=norm(userText); if(!u) return false;
  return acceptable(expected).has(u);
}
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const promptOf = w => state.direction==="es2en" ? w.es : w.en;
const answerOf = w => state.direction==="es2en" ? w.en : w.es;

// Spanish answers KEEP the article (el/la/los…) — accents are still forgiven.
function normEs(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[¿?¡!.,;:"']/g," ").replace(/\s+/g," ").trim();
}
function acceptableEs(expected){
  const set=new Set();
  const noParen=expected.replace(/\(.*?\)/g," ");
  [expected, noParen].forEach(v=>{ const n=normEs(v); if(n) set.add(n); });
  expected.split("/").forEach(p=>{ const n=normEs(p); if(n) set.add(n); });
  return set;
}
// dir 'en2es' means the answer is Spanish (article required); 'es2en' means English (lenient).
function checkAns(user, answer, answerIsEs){
  if(!user || !user.trim()) return false;
  return answerIsEs ? acceptableEs(answer).has(normEs(user)) : isCorrect(user, answer);
}

/* ===================== PRESENT-TENSE CONJUGATION ===================== */
function regularConj(inf){
  const stem=inf.slice(0,-2), end=inf.slice(-2);
  const E={ar:["o","as","a","amos","áis","an"], er:["o","es","e","emos","éis","en"], ir:["o","es","e","imos","ís","en"]}[end];
  return { yo:stem+E[0], tu:stem+E[1], el:stem+E[2], nos:stem+E[3], vos:stem+E[4], ellos:stem+E[5] };
}
function bootStem(stem, change){ const [f,t]=change.split("-"); const i=stem.lastIndexOf(f); return i<0?stem:stem.slice(0,i)+t+stem.slice(i+1); }
function bootConj(inf, change){
  const reg=regularConj(inf), bstem=bootStem(inf.slice(0,-2), change), end=inf.slice(-2);
  const E={ar:["o","as","a","an"], er:["o","es","e","en"], ir:["o","es","e","en"]}[end];
  return { yo:bstem+E[0], tu:bstem+E[1], el:bstem+E[2], nos:reg.nos, vos:reg.vos, ellos:bstem+E[3] };
}
const _RP={yo:"me",tu:"te",el:"se",nos:"nos",vos:"os",ellos:"se"};
function conjugate(v){
  const reflexive=v.inf.endsWith("se"), base=reflexive?v.inf.slice(0,-2):v.inf;
  let f = v.forms ? {...v.forms} : v.type==="boot" ? bootConj(base, v.change) : regularConj(base);
  if(reflexive){ const o={}; for(const k in f) o[k]=_RP[k]+" "+f[k]; return o; }
  return f;
}

/* -------- Word list (like the sheet) + Practice button -------- */
function groupedWords(withBox){
  ensureSelectedObj();
  const words=allWords();
  let h="";
  unit().sets.forEach(set=>{
    const inSec=words.filter(w=>w.section===set.name);
    if(!inSec.length) return;
    h+=`<div class="sectionhdr">${esc(set.name)}</div><div class="wordgrid">`;
    inSec.forEach(w=>{
      const on=isSel(w);
      h+=`<div class="wcard ${withBox?(on?'on':'off'):'read'}" ${withBox?`data-k="${esc(key(w))}"`:''}>
            ${withBox?`<span class="box">${on?'✓':''}</span>`:''}
            <div class="txt"><div class="es">${esc(w.es)}</div><div class="en">${esc(w.en)}</div></div>
          </div>`;
    });
    h+=`</div>`;
  });
  return h;
}

/* -------- Step 3: the quiz -------- */
function startQuiz(){
  const pool=selectedWords();
  const q=shuffle(pool).map(w=>({ w, dir: state.pdir==="mix" ? (Math.random()<0.5?"es2en":"en2es") : state.pdir }));
  state.session={ queue:q, i:0, correct:0, wrong:[], result:null, curWrong:false };
}
function renderQuiz(c){
  const s=state.session;
  if(!s){ state.pstep=null; return render(); }

  // Summary
  if(s.i>=s.queue.length){
    const pct=s.queue.length?Math.round(s.correct/s.queue.length*100):0;
    let h=`<div class="stage summary">
      <div class="lbl">First-try score</div><div class="big">${pct}%</div>
      <div class="lbl">${s.correct} of ${s.queue.length} right on the first try</div>`;
    if(s.wrong.length){
      h+=`<div class="missed"><div class="sectionhdr">Words you had to retry</div>`;
      s.wrong.forEach(it=>{h+=`<div class="m"><span>${esc(it.w.es)}</span><span>${esc(it.w.en)}</span></div>`;});
      h+=`</div>`;
    }
    h+=`<div class="fbrow">
        ${s.wrong.length?`<button class="pill" id="retry">🔁 Retry the ${s.wrong.length} tricky ones</button>`:``}
        <button class="pill ghost" id="restart">↻ Start over</button>
        <button class="pill ghost" id="done">Done</button>
      </div></div>`;
    c.innerHTML=h;
    if(s.wrong.length) c.querySelector("#retry").onclick=()=>{ state.session={queue:shuffle(s.wrong),i:0,correct:0,wrong:[],result:null,curWrong:false}; render(); };
    c.querySelector("#restart").onclick=()=>{ startQuiz(); render(); };

  }

  const it=s.queue[s.i], w=it.w, dir=it.dir;

  const prompt = dir==="es2en" ? w.es : w.en;
  const answer = dir==="es2en" ? w.en : w.es;

  let h=`<div class="stage">

    h+=`<div class="feedback good">✓ ¡Correcto!<span class="corr">${esc(prompt)} = <b>${esc(answer)}</b></span></div>
      <div class="fbrow"><button class="pill" id="next">Next →</button></div>`;
  }else{

    if(answerIsEs){
      h+=`<div class="accents">${ACCENTS.map(ch=>`<button class="accbtn" data-ch="${ch}">${ch}</button>`).join('')}</div>`;
    }
    if(s.result==="wrong"){
      h+=`<div class="feedback bad">✕ Not quite — try again<span class="corr">Correct answer: <b>${esc(answer)}</b></span></div>`;
    }
  }
  h+=`</div>`;
  c.innerHTML=h;

  if(s.result==="right"){
    const next=()=>{ s.i++; s.result=null; s.curWrong=false; render(); };
    c.querySelector("#next").onclick=next;
    document.addEventListener("keydown", function onk(e){ if(e.key==="Enter"){ document.removeEventListener("keydown",onk); next(); } });
  }else{
    const inp=c.querySelector("#ans"); inp.focus();
    c.querySelectorAll(".accbtn").forEach(b=>b.onclick=()=>insertChar(b.dataset.ch));
    const submit=()=>{
      if(checkAns(inp.value, answer, answerIsEs)){
        if(!s.curWrong) s.correct++;
        s.result="right";
      }else{
        if(!s.curWrong){ s.curWrong=true; s.wrong.push(it); }
        s.result="wrong";
      }
      render();
    };
    c.querySelector("#check").onclick=submit;
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
  }
}

function renderCDisplay(c){
  const opts=[['es','🇪🇸','Spanish','Prompts like "ella · preferir"'],['en','🇬🇧','English','Prompts like "she · to prefer"'],['mix','🔀','Mix','A random mix of both']];

    <div class="dirlist">${opts.map(([k,ic,t,d])=>`<button class="dircard" data-disp="${k}"><span class="di">${ic}</span><div class="dtx"><div class="dt">${t}</div><div class="dd">${d}</div></div><span class="go">→</span></button>`).join('')}</div>`;

  c.querySelectorAll("[data-disp]").forEach(b=>b.onclick=()=>{ state.cdisp=b.dataset.disp; startCQuiz(); state.cstep='quiz'; render(); });
}
function startCQuiz(){
  const pickLang = () => state.cdisp==='mix' ? (Math.random()<0.5?'es':'en') : state.cdisp;
  const verbs = cIncluded();
  let q;
  if(state.ccover==='mixed'){
    // One pronoun per verb. The ending is dealt from a shuffled cycle of all six
    // rather than picked at random, so even a short review spreads across the
    // endings instead of leaning on whichever ones have the most subjects.
    let cycle=[];
    q = shuffle(verbs).map(v=>{
      if(!cycle.length) cycle=shuffle(FORMS);
      const form=cycle.pop();
      return { v, subj: pickSubj(form), lang: pickLang() };
    });
  }else{
    // Every verb is asked once per ending — yo, tú, él, nosotros, vosotros, ellos —
    // with a different subject drawn from that ending's group each time.
    const perVerb = verbs.map(v =>
      shuffle(FORMS).map(form => ({ v, subj: pickSubj(form), lang: pickLang() }))
    );
    // Deal one round at a time so the same verb never comes up back-to-back.
    q=[];
    for(let r=0; r<FORMS.length; r++) shuffle(perVerb.map(list=>list[r])).forEach(item=>q.push(item));
  }
  state.csession={ queue:q, i:0, correct:0, wrong:[], result:null, curWrong:false };
}

  if(s.result==='right'){

      <div class="fbrow"><button class="pill" id="next">Next →</button></div>`;
  }else{

    if(s.result==='wrong'){

    }
  }

    <div class="flash">
      <div class="fcard ${f.flip?'flip':''}" id="fc">
        <div class="face front"><div class="tag">${state.direction==='es2en'?'Español':'English'} · ${esc(w.section)}</div><div class="big">${esc(front)}</div><div class="hint">tap to flip</div></div>
        <div class="face back"><div class="tag">${state.direction==='es2en'?'English':'Español'}</div><div class="big">${esc(back)}</div><div class="hint">tap to flip</div></div>
      </div>
      <div class="flashbar">
        <button class="rounder" id="prev">‹</button>
        <div class="progtxt">${(f.i%f.order.length)+1} / ${f.order.length}</div>
        <button class="rounder" id="next">›</button>
        <button class="rounder" id="shuf" title="Shuffle">🔀</button>
      </div>
    </div>`;
  c.querySelector("#fc").onclick=()=>{ f.flip=!f.flip; render(); };
  c.querySelector("#prev").onclick=e=>{e.stopPropagation(); f.i=(f.i-1+f.order.length)%f.order.length; f.flip=false; render();};
  c.querySelector("#next").onclick=e=>{e.stopPropagation(); f.i=(f.i+1)%f.order.length; f.flip=false; render();};
  c.querySelector("#shuf").onclick=e=>{e.stopPropagation(); f.order=shuffle(f.order); f.i=0; f.flip=false; render();};
}

/* ============================ INIT ============================ */
load(); render();
</script>
</body>
</html>
